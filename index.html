<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#16833b">
<title>VARZID — Мағозаи онлайн</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --green:#16833b;
  --green2:#0e682e;
  --light:#f4f6f7;
  --white:#fff;
  --text:#172019;
  --muted:#737b76;
  --border:#e2e6e3;
  --red:#e53935;
  --shadow:0 3px 14px rgba(0,0,0,.08);
}

body{
  background:var(--light);
  color:var(--text);
  padding-bottom:75px;
}

button{
  border:0;
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.topbar{
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 13px;
}

.logo{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:max-content;
}

.logoMark{
  width:39px;
  height:39px;
  background:var(--green);
  color:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
}

.logoText{
  font-size:21px;
  font-weight:900;
  color:var(--green);
  letter-spacing:.5px;
}

.search{
  flex:1;
  background:#f0f2f1;
  border-radius:12px;
  height:42px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:7px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
}

.langBtn{
  background:#eef7f0;
  color:var(--green);
  padding:10px 8px;
  border-radius:10px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 12px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:22px;
  background:#fff;
  color:#424a45;
  border:1px solid var(--border);
  font-size:13px;
}

.cat.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.banner{
  background:linear-gradient(135deg,#16833b,#36a85e);
  color:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.banner h1{
  font-size:24px;
  margin-bottom:6px;
}

.banner p{
  opacity:.95;
  font-size:14px;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0;
}

.sectionTitle h2{
  font-size:18px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.product{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
}

.productImage{
  height:150px;
  background:#f3f6f3;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:68px;
  cursor:pointer;
  position:relative;
}

.favorite{
  position:absolute;
  right:8px;
  top:8px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#fff;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:2;
}

.favorite.active{
  color:var(--red);
}

.productInfo{
  padding:10px;
}

.productName{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

.productCat{
  color:var(--muted);
  font-size:11px;
  margin-bottom:7px;
}

.price{
  font-size:17px;
  font-weight:900;
  color:var(--green);
}

.stock{
  font-size:11px;
  margin-top:4px;
  color:#69736d;
}

.stock.zero{
  color:var(--red);
}

.addBtn{
  width:100%;
  margin-top:9px;
  padding:10px;
  background:var(--green);
  color:#fff;
  border-radius:10px;
  font-weight:bold;
}

.addBtn:disabled{
  background:#c8ceca;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:var(--muted);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:67px;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.navBtn{
  background:none;
  color:#737b76;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  position:relative;
}

.navBtn .icon{
  font-size:22px;
}

.navBtn.active{
  color:var(--green);
  font-weight:bold;
}

.badge{
  position:absolute;
  top:-3px;
  right:7px;
  min-width:17px;
  height:17px;
  background:var(--red);
  color:#fff;
  border-radius:50%;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.cartItem{
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid var(--border);
  padding:10px 0;
}

.cartEmoji{
  width:55px;
  height:55px;
  background:#f2f5f2;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.cartInfo{
  flex:1;
}

.cartName{
  font-weight:bold;
  font-size:14px;
}

.cartPrice{
  color:var(--green);
  font-weight:bold;
  font-size:13px;
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:29px;
  height:29px;
  border-radius:8px;
  background:#eaf3ec;
  color:var(--green);
  font-weight:bold;
  font-size:17px;
}

.delete{
  background:none;
  color:var(--red);
  font-size:18px;
}

.totalBox{
  display:flex;
  justify-content:space-between;
  padding-top:12px;
  font-size:18px;
  font-weight:900;
}

.primaryBtn{
  width:100%;
  background:var(--green);
  color:#fff;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
  margin-top:12px;
  font-size:15px;
}

.whatsappBtn{
  width:100%;
  background:#20bd5a;
  color:#fff;
  padding:14px;
  border-radius:11px;
  font-weight:bold;
  margin-top:10px;
  font-size:15px;
}

.input{
  width:100%;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  outline:none;
  margin-bottom:9px;
  font-size:14px;
}

.input:focus{
  border-color:var(--green);
}

.label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:5px;
}

.paymentOption{
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
}

.paymentOption.selected{
  border:2px solid var(--green);
  background:#f1f9f3;
}

.order{
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.orderTop{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  gap:8px;
}

.orderNumber{
  font-weight:bold;
  color:var(--green);
}

.status{
  font-size:11px;
  padding:5px 8px;
  border-radius:12px;
  background:#edf5ef;
  color:var(--green);
}

.orderLine{
  font-size:13px;
  color:#555;
  margin:5px 0;
}

.profileHead{
  text-align:center;
  padding:20px;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#e6f2e9;
  color:var(--green);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.menuItem{
  width:100%;
  padding:15px 5px;
  border-bottom:1px solid var(--border);
  background:none;
  text-align:left;
  font-size:15px;
  display:flex;
  justify-content:space-between;
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);
  background:#202522;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modalBox{
  background:#fff;
  width:100%;
  max-width:500px;
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:17px;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  background:#edf0ee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.imageLarge{
  height:330px;
  background:#f3f6f3;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:140px;
}

.langList button{
  width:100%;
  padding:13px;
  margin:4px 0;
  border-radius:10px;
  background:#f1f4f2;
  text-align:left;
  font-size:15px;
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .bottomNav{
    max-width:700px;
    left:50%;
    transform:translateX(-50%);
    border:1px solid var(--border);
    border-radius:20px 20px 0 0;
  }
}

@media(max-width:390px){
  .logoText{
    display:none;
  }

  .productImage{
    height:135px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="topbar">

    <div class="logo">
      <div class="logoMark">V</div>
      <div class="logoText">VARZID</div>
    </div>

    <div class="search">
      🔎
      <input
        id="searchInput"
        placeholder="Ҷустуҷӯи маҳсулот..."
        oninput="renderProducts()"
      >
    </div>

    <button class="langBtn" onclick="openLanguage()">🌐</button>

  </div>

</header>


<main class="container">

<!-- HOME -->

<section id="homePage" class="page active">

  <div class="categories" id="categories"></div>

  <div class="banner">

    <h1>VARZID</h1>

    <p id="bannerText">
      Мағозаи онлайн барои маҳсулот ва таҷҳизот
    </p>

  </div>

  <div class="sectionTitle">

    <h2 id="productsTitle">
      Маҳсулот
    </h2>

  </div>

  <div class="products" id="products"></div>

</section>


<!-- FAVORITES -->

<section id="favoritesPage" class="page">

  <div class="sectionTitle">

    <h2 id="favTitle">
      ❤️ Дӯстдоштаҳо
    </h2>

  </div>

  <div class="products" id="favorites"></div>

</section>


<!-- CART -->

<section id="cartPage" class="page">

  <div class="sectionTitle">

    <h2 id="cartTitle">
      🛒 Сабад
    </h2>

  </div>

  <div class="card">

    <div id="cartItems"></div>

    <div class="totalBox">

      <span id="totalText">
        Ҳамагӣ:
      </span>

      <span id="cartTotal">
        0 сомонӣ
      </span>

    </div>

    <button
      class="primaryBtn"
      onclick="openCheckout()"
      id="checkoutBtn"
    >
      Идома додани фармоиш
    </button>

  </div>

</section>


<!-- ORDERS -->

<section id="ordersPage" class="page">

  <div class="sectionTitle">

    <h2 id="ordersTitle">
      📦 Фармоишҳои ман
    </h2>

  </div>

  <div class="card">

    <div id="ordersList"></div>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="page">

  <div class="card profileHead">

    <div class="avatar">
      👤
    </div>

    <h2 style="margin-top:10px" id="profileTitle">
      Профил
    </h2>

    <p
      style="color:#777;margin-top:5px"
      id="profileSub"
    >
      Маълумоти муштарӣ
    </p>

  </div>


  <div class="card">

    <button
      class="menuItem"
      onclick="openCheckout()"
    >
      👤
      <span id="profileOrder">
        Фармоиш додан
      </span>
      <b>›</b>
    </button>


    <button
      class="menuItem"
      onclick="showPage('orders')"
    >
      📦
      <span id="profileOrders">
        Фармоишҳои ман
      </span>
      <b>›</b>
    </button>


    <button
      class="menuItem"
      onclick="showPage('favorites')"
    >
      ❤️
      <span id="profileFav">
        Дӯстдоштаҳо
      </span>
      <b>›</b>
    </button>


    <button
      class="menuItem"
      onclick="openLanguage()"
    >
      🌐
      <span id="profileLang">
        Забон
      </span>
      <b>›</b>
    </button>

  </div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottomNav">

  <button
    class="navBtn active"
    id="navHome"
    onclick="showPage('home')"
  >
    <span class="icon">🏠</span>
    <span id="navHomeText">Асосӣ</span>
  </button>


  <button
    class="navBtn"
    id="navFav"
    onclick="showPage('favorites')"
  >

    <span class="icon">❤️</span>

    <span
      class="badge"
      id="favBadge"
      style="display:none"
    >
      0
    </span>

    <span id="navFavText">
      Дӯстдошта
    </span>

  </button>


  <button
    class="navBtn"
    id="navCart"
    onclick="showPage('cart')"
  >

    <span class="icon">🛒</span>

    <span
      class="badge"
      id="cartBadge"
      style="display:none"
    >
      0
    </span>

    <span id="navCartText">
      Сабад
    </span>

  </button>


  <button
    class="navBtn"
    id="navOrders"
    onclick="showPage('orders')"
  >

    <span class="icon">📦</span>

    <span id="navOrdersText">
      Фармоиш
    </span>

  </button>


  <button
    class="navBtn"
    id="navProfile"
    onclick="showPage('profile')"
  >

    <span class="icon">👤</span>

    <span id="navProfileText">
      Профил
    </span>

  </button>

</nav>


<!-- IMAGE MODAL -->

<div class="modal" id="imageModal">

  <div class="modalBox">

    <div class="modalHeader">

      <b id="imageModalTitle">
        Маҳсулот
      </b>

      <button
        class="close"
        onclick="closeModal('imageModal')"
      >
        ×
      </button>

    </div>


    <div
      class="imageLarge"
      id="largeImage"
    >
      🌾
    </div>


    <h2
      id="largeName"
      style="margin-top:13px"
    ></h2>


    <p
      id="largeCategory"
      style="color:#777;margin-top:5px"
    ></p>


    <p
      id="largePrice"
      class="price"
      style="margin-top:8px"
    ></p>


    <button
      class="primaryBtn"
      id="largeAddBtn"
    >
      🛒 Ба сабад
    </button>

  </div>

</div>


<!-- LANGUAGE MODAL -->

<div
  class="modal"
  id="languageModal"
>

  <div class="modalBox">

    <div class="modalHeader">

      <b>
        🌐 Забон
      </b>

      <button
        class="close"
        onclick="closeModal('languageModal')"
      >
        ×
      </button>

    </div>


    <div class="langList">

      <button onclick="setLanguage('tg')">
        🇹🇯 Тоҷикӣ
      </button>

      <button onclick="setLanguage('ru')">
        🇷🇺 Русский
      </button>

      <button onclick="setLanguage('uz')">
        🇺🇿 O‘zbekcha
      </button>

    </div>

  </div>

</div>


<!-- CHECKOUT -->

<div
  class="modal"
  id="checkoutModal"
>

  <div class="modalBox">

    <div class="modalHeader">

      <b id="checkoutTitle">
        📦 Фармоиш
      </b>

      <button
        class="close"
        onclick="closeModal('checkoutModal')"
      >
        ×
      </button>

    </div>


    <label
      class="label"
      id="nameLabel"
    >
      Ном ва насаб
    </label>

    <input
      class="input"
      id="customerName"
      placeholder="Номи шумо"
    >


    <label
      class="label"
      id="phoneLabel"
    >
      Рақами телефон
    </label>

    <input
      class="input"
      id="customerPhone"
      type="tel"
      placeholder="+992..."
    >


    <label
      class="label"
      id="addressLabel"
    >
      Суроғаи расонидан
    </label>

    <textarea
      class="input"
      id="customerAddress"
      rows="3"
      placeholder="Суроғаи шумо"
    ></textarea>


    <label
      class="label"
      style="margin-top:5px"
    >
      💵 Тарзи пардохт
    </label>


    <div
      class="paymentOption selected"
    >

      <input
        type="radio"
        checked
      >

      <div>

        <b id="cashTitle">
          💵 Нақд ҳангоми гирифтани фармоиш
        </b>

        <div
          style="font-size:11px;color:#777"
          id="cashSub"
        >
          Пардохт ба расонанда
        </div>

      </div>

    </div>


    <div
      class="card"
      style="margin-top:12px;background:#f7faf8"
    >

      <div
        style="display:flex;justify-content:space-between"
      >

        <span id="checkoutTotalText">
          Ҳамагӣ:
        </span>

        <b id="checkoutTotal">
          0 сомонӣ
        </b>

      </div>

    </div>


    <button
      class="primaryBtn"
      onclick="placeOrder()"
      id="confirmBtn"
    >
      ✅ Тасдиқи фармоиш
    </button>


    <button
      class="whatsappBtn"
      onclick="sendOrderToWhatsApp()"
      id="whatsappBtn"
    >
      📲 Фармоишро тавассути WhatsApp фиристодан
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>

function t(key){

}


function save(){

    "varzid_cart",

function getCategoryName(id){

  const c =
    categories.find(x=>x.id===id);

  return c
    ? c[currentLanguage]
    : id;

}


function money(n){

  return Number(n).toLocaleString()
    + " сомонӣ";

}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{

      el.classList.remove("show");

    },2200);

}

function renderProducts(){

  const box =
    document.getElementById("products");

  const input =

  const search =

      .toLowerCase()
      .trim();

  let list =

      const categoryOK =

        p.category===currentCategory;

          ? "Товар не найден"

    return;

  box.innerHTML =
    list.map(productCard).join("");

}


function productCard(p){

  const fav =
    favorites.includes(p.id);

  const zero =
    p.stock<=0;


  return `

    <div class="product">

      <button
        class="favorite ${fav?"active":""}"
        onclick="toggleFavorite(${p.id})"
      >
        ${fav?"♥":"♡"}
      </button>


      <div
        class="productImage"
        onclick="openImage(${p.id})"
      >
        ${p.emoji}
      </div>


      <div class="productInfo">

        <div class="productName">
          ${p.name}
        </div>


        <div class="productCat">
          ${getCategoryName(p.category)}
        </div>


        <div class="price">
          ${money(p.price)}
        </div>


        <div
          class="stock ${zero?"zero":""}"
        >
          ${
            zero
            ? t("soldOut")
            : t("stock")+": "+p.stock
          }
        </div>


        <button
          class="addBtn"
          ${zero?"disabled":""}
          onclick="addToCart(${p.id})"
        >
          ${zero?t("soldOut"):t("add")}
        </button>

      </div>

    </div>

  `;

}

function toggleFavorite(id){

}

}


/* =========================
   CART
========================= */

function addToCart(id){

  const product =
    products.find(p=>p.id===id);

  if(!product || product.stock<=0)
    return;


  const item =
    cart.find(x=>x.id===id);


  if(item){

    if(item.qty>=product.stock){

      toast(t("stockError"));

      return;
    }

    item.qty++;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }


  save();

  updateBadges();

  renderCart();

  toast(t("added"));

}


function removeFromCart(id){

  cart =
    cart.filter(x=>x.id!==id);

  save();

  updateBadges();

  renderCart();

}


function changeQty(id,amount){

  const item =
    cart.find(x=>x.id===id);

  const product =
    products.find(x=>x.id===id);


  if(!item || !product)
    return;


  const newQty =
    item.qty+amount;


  if(newQty<=0){

    removeFromCart(id);

    return;
  }


  if(newQty>product.stock){

    toast(t("stockError"));

    return;
  }


  item.qty=newQty;

  save();

  renderCart();

  updateBadges();

}


function cartTotal(){

  return cart.reduce(
    (sum,item)=>{

      const p =
        products.find(
          x=>x.id===item.id
        );

      return sum+
        (p
          ? p.price*item.qty
          : 0);

    },0
  );

}


function cartCount(){

  return cart.reduce(
    (sum,x)=>sum+x.qty,
    0
  );

}


function renderCart(){

  const box =
    document.getElementById("cartItems");


  if(!cart.length){

    box.innerHTML=`

      <div class="empty">

        🛒<br><br>

        ${t("emptyCart")}

      </div>

    `;

    document.getElementById(
      "cartTotal"
    ).textContent=money(0);

    return;
  }


  box.innerHTML =
    cart.map(item=>{

      const p =
        products.find(
          x=>x.id===item.id
        );

      if(!p) return "";


      return `

        <div class="cartItem">

          <div class="cartEmoji">
            ${p.emoji}
          </div>


          <div class="cartInfo">

            <div class="cartName">
              ${p.name}
            </div>

            <div class="cartPrice">
              ${money(p.price*item.qty)}
            </div>

          </div>


          <div class="qty">

            <button
              onclick="changeQty(${p.id},-1)"
            >
              −
            </button>

            <b>
              ${item.qty}
            </b>

            <button
              onclick="changeQty(${p.id},1)"
            >
              +
            </button>

          </div>


          <button
            class="delete"
            onclick="removeFromCart(${p.id})"
          >
            🗑
          </button>

        </div>

      `;

    }).join("");


  document.getElementById(
    "cartTotal"
  ).textContent =
    money(cartTotal());

}

function getCustomerData(){

      document
        .getElementById("customerName")
        .value

    phone:
      document
        .getElementById("customerPhone")
        .value
        .trim(),

    address:
      document

        .value
        .trim()

  };

}


function validateCustomer(){

  const d =
    getCustomerData();


  if(
    !d.name ||
    !d.phone ||
    !d.address
  ){

    toast(t("fill"));

    return false;
  }


  return true;

}


/* =========================
   ORDER NUMBER
========================= */

function generateOrderNumber(){

  return "VZ-"+
    Math.floor(
      100000+
      Math.random()*900000
    );

}


/* =========================
   CREATE ORDER
========================= */

function createOrder(){

  const d =
    getCustomerData();


  return {

    id:Date.now(),

    number:
      generateOrderNumber(),

    name:d.name,

    phone:d.phone,

    address:d.address,

    payment:"cash",

    total:
      cartTotal(),

    status:
      t("orderStatus"),

    created:
      new Date().toLocaleString(),

    items:

      cart.map(item=>{

        const p =
          products.find(
            x=>x.id===item.id
          );


        return {

          id:p.id,

          name:p.name,

          price:p.price,

          qty:item.qty,

          emoji:p.emoji

        };

      })

  };

}


/* =========================
   NORMAL ORDER
========================= */

function placeOrder(){

  if(!validateCustomer())
    return;


  for(const item of cart){

    const p =
      products.find(
        x=>x.id===item.id
      );


    if(
      !p ||
      item.qty>p.stock
    ){

      toast(t("stockError"));

      return;
    }

  }


  const order =
    createOrder();


  cart.forEach(item=>{

    const p =
      products.find(
        x=>x.id===item.id
      );

    if(p)
      p.stock-=item.qty;

  });


  orders.unshift(order);

  cart=[];

  save();


  closeModal("checkoutModal");


  updateBadges();

  renderProducts();

  renderCart();

  renderOrders();


  toast(
    t("orderSuccess")
    +" • "
    +order.number
  );


  showPage("orders");

}

   WHATSAPP ORDER
========================= */

function sendOrderToWhatsApp(){

  if(!validateCustomer())
    return;


  if(!cart.length){

    toast(t("emptyCart"));

    return;
  }


  for(const item of cart){

    const p =
      products.find(
        x=>x.id===item.id
      );


    if(
      !p ||
      item.qty>p.stock
    ){

      toast(t("stockError"));

      return;
    }

  }


  const order =
    createOrder();


  let text="";


  text+=
    t("whatsappText")
    +"\n\n";


  text+="📦 "
    +t("orderNumber")
    +": "
    +order.number
    +"\n";


  text+="👤 "
    +t("name")
    +": "
    +order.name
    +"\n";


  text+="📞 "
    +t("phone")
    +": "
    +order.phone
    +"\n";


  text+="📍 "
    +t("address")
    +": "
    +order.address
    +"\n";


  text+="\n🛒 "
    +t("products")
    +":\n";


  order.items.forEach(item=>{

    text+=

      item.emoji
      +" "
      +item.name
      +" × "
      +item.qty
      +" = "
      +money(
        item.price*
        item.qty
      )
      +"\n";

  });


  text+=

    "\n💰 "
    +t("total")
    +" "
    +money(order.total)
    +"\n";


  text+=

    "💵 "
    +t("paymentCash")
    +"\n";


  /*
    Фармоишро дар ҳамин телефон
    ҳам нигоҳ медорем.
  */

  orders.unshift(order);

  /*
    Дар WhatsApp фиристодан:
    stock ҳам кам мешавад,
    чун муштарӣ фармоишро фиристод.
  */

  cart.forEach(item=>{

    const p =
      products.find(
        x=>x.id===item.id
      );

    if(p)
      p.stock-=item.qty;

  });


  cart=[];

  save();

  updateBadges();

  renderCart();

  renderProducts();

  renderOrders();


  const url =
    "https://wa.me/"
    +WHATSAPP_NUMBER
    +"?text="
    +encodeURIComponent(text);


  window.open(
    url,
    "_blank"
  );


  closeModal(
    "checkoutModal"
  );


  toast(
    order.number
  );

}


/* =========================
   ORDERS
========================= */

function renderOrders(){

  const box =
    document.getElementById(
      "ordersList"
    );


  if(!orders.length){

    box.innerHTML=`

      <div class="empty">

        📦<br><br>

        ${t("emptyOrders")}

      </div>

    `;

    return;
  }


  box.innerHTML =
    orders.map(order=>{

      const items =
        order.items
          .map(x=>
            `${x.emoji} ${x.name} × ${x.qty}`
          )
          .join("<br>");


      return `

        <div class="order">

          <div class="orderTop">

            <span class="orderNumber">

              ${order.number}

            </span>


            <span class="status">

              ${order.status}

            </span>

          </div>


          <div class="orderLine">

            📅 ${order.created}

          </div>


          <div class="orderLine">

            ${items}

          </div>


          <div class="orderLine">

            💰
            <b>
              ${money(order.total)}
            </b>

          </div>


          <div class="orderLine">

            💵
            ${t("paymentCash")}

          </div>


          <div class="orderLine">

            📍
            ${order.address}

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   INIT
========================= */

function init(){

  applyLanguage();

  renderCategories();

  renderProducts();

  renderFavorites();

  renderCart();

  renderOrders();

  updateBadges();

}


init();


/* =========================
   CLOSE MODAL
========================= */

document
  .querySelectorAll(".modal")
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      function(e){

        if(e.target===modal){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });

</script>
