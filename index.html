<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VARZID — Marketplace</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#16843a;
  --green2:#0d6b2d;
  --bg:#f5f7f6;
  --card:#fff;
  --text:#18231c;
  --muted:#718078;
  --border:#e5ebe7;
  --shadow:0 5px 20px rgba(0,0,0,.07);
}

body.dark{
  --bg:#101512;
  --card:#18201b;
  --text:#f2f5f3;
  --muted:#a7b2ab;
  --border:#2b362f;
  --shadow:0 5px 20px rgba(0,0,0,.25);
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:78px;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.top{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
}

.brand{
  display:flex;
  align-items:center;
}

.brand-name{
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
  color:var(--green);
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:50%;
  font-size:20px;
}

/* SEARCH */

.search-wrap{
  padding:0 12px 11px;
}

.search{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:15px;
  padding:0 12px;
  height:48px;
}

.search span{
  font-size:19px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:15px;
}

.camera{
  position:relative;
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.camera input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

/* CONTENT */

main{
  max-width:900px;
  margin:auto;
  padding:15px 12px;
}

.section-title{
  font-size:20px;
  font-weight:800;
  margin:8px 2px 12px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:3px 1px 12px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:15px;
  padding:10px 13px;
  display:flex;
  align-items:center;
  gap:7px;
  box-shadow:var(--shadow);
}

.cat.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
}

.product-img{
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#edf7ef,#f8fbf9);
  font-size:70px;
}

.dark .product-img{
  background:#202a24;
}

.heart{
  position:absolute;
  right:9px;
  top:9px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:19px;
}

.info{
  padding:11px;
}

.name{
  font-size:16px;
  font-weight:700;
  margin-bottom:6px;
}

.price{
  font-weight:800;
  color:var(--green);
  margin-bottom:9px;
}

.stock{
  font-size:13px;
  margin-bottom:9px;
}

.in{
  color:#16843a;
}

.out{
  color:#d33;
}

.add{
  width:100%;
  border:0;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  padding:10px;
  font-weight:700;
}

.add.added{
  background:#e8f4eb;
  color:var(--green);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
  display:none;
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* CART */

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px;
  margin-bottom:10px;
}

.cart-emoji{
  width:55px;
  height:55px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-size:30px;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-weight:700;
  margin-bottom:4px;
}

.cart-price{
  color:var(--green);
  font-weight:700;
}

.remove{
  border:0;
  background:transparent;
  font-size:20px;
}

.total{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:800;
}

.checkout{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:white;
  padding:13px;
  font-weight:800;
}

/* PROFILE */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

.profile-row{
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.profile-row:last-child{
  border-bottom:0;
}

.profile-row button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
}

/* MAP */

.map{
  width:100%;
  height:270px;
  border:0;
  border-radius:18px;
  margin-top:12px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:100;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:12px;
  position:relative;
}

.nav-icon{
  font-size:21px;
}

.nav.active{
  color:var(--green);
  font-weight:700;
}

.badge{
  position:absolute;
  top:6px;
  right:24%;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#e53935;
  color:white;
  font-size:10px;
  display:none;
  align-items:center;
  justify-content:center;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translate(-50%,20px);
  background:#18201b;
  color:white;
  padding:12px 17px;
  border-radius:13px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  background:var(--card);
  border-radius:22px 22px 0 0;
  padding:20px;
}

.modal h3{
  margin-bottom:15px;
}

.modal input{
  width:100%;
  height:46px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 12px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-buttons button{
  padding:12px;
  border-radius:11px;
  border:0;
}

.cancel{
  background:var(--bg);
  color:var(--text);
}

.send{
  background:var(--green);
  color:white;
}

/* DESKTOP */

@media(min-width:700px){

  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .product-img{
    height:160px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="brand">
      <div class="brand-name">VARZID</div>
    </div>

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙
    </button>

  </div>

  <div class="search-wrap">

    <div class="search">

      <span>🔎</span>

      <input
        id="search"
        type="search"
        placeholder="Ҷустуҷӯ..."
        oninput="renderProducts()"
      >

      <label class="camera">
        📷

        <input
          type="file"
          accept="image/*"
          capture="environment"
          onchange="photoSelected(this)"
        >

      </label>

    </div>

  </div>

</header>


<main>

<!-- HOME -->

<section
  id="homePage"
  class="page active"
>

  <div
    class="section-title"
    data-t="categories"
  >
    Категорияҳо
  </div>

  <div class="categories">

    <button
      class="cat active"
      data-cat="all"
      onclick="setCategory('all',this)"
    >
      🏪
      <span data-t="all">
        Ҳама
      </span>
    </button>

    <button
      class="cat"
      data-cat="farm"
      onclick="setCategory('farm',this)"
    >
      🌾
      <span data-t="farm">
        Кишоварзӣ
      </span>
    </button>

    <button
      class="cat"
      data-cat="vegetable"
      onclick="setCategory('vegetable',this)"
    >
      🥕
      <span data-t="vegetable">
        Сабзавот
      </span>
    </button>

    <button
      class="cat"
      data-cat="vitamin"
      onclick="setCategory('vitamin',this)"
    >
      💊
      <span data-t="vitamin">
        Витаминҳо
      </span>
    </button>

    <button
      class="cat"
      data-cat="equipment"
      onclick="setCategory('equipment',this)"
    >
      🔧
      <span data-t="equipment">
        Таҷҳизот
      </span>
    </button>

  </div>


  <div
    class="section-title"
    data-t="products"
  >
    Маҳсулот
  </div>

  <div
    id="products"
    class="products"
  ></div>

  <div
    id="empty"
    class="empty"
  >
    🔎
    <span data-t="notfound">
      Маҳсулот ёфт нашуд
    </span>
  </div>


  <div
    class="section-title"
    style="margin-top:25px"
    data-t="map"
  >
    Харита
  </div>

  <iframe
    class="map"
    src="https://www.openstreetmap.org/export/embed.html?bbox=69.55%2C37.80%2C69.70%2C37.90&layer=mapnik"
  ></iframe>

</section>


<!-- FAVORITES -->

<section
  id="favoritesPage"
  class="page"
>

  <div
    class="section-title"
    data-t="favorites"
  >
    Дӯстдоштаҳо
  </div>

  <div
    id="favoritesList"
    class="products"
  ></div>

  <div
    id="favoritesEmpty"
    class="empty"
  >
    ❤️
    <span data-t="emptyFav">
      Ҳоло маҳсулоти дӯстдошта нест
    </span>
  </div>

</section>


<!-- CART -->

<section
  id="cartPage"
  class="page"
>

  <div
    class="section-title"
    data-t="cart"
  >
    Сабад
  </div>

  <div id="cartList"></div>

  <div
    id="cartEmpty"
    class="empty"
  >
    🛒
    <span data-t="emptyCart">
      Сабад холӣ аст
    </span>
  </div>

  <div
    id="cartBottom"
    style="display:none"
  >

    <div class="total">

      <span data-t="total">
        Ҳамагӣ
      </span>

      <span id="total">
        0 сомонӣ
      </span>

    </div>

    <button
      class="checkout"
      onclick="openOrder()"
    >
      📲
      <span data-t="order">
        Фармоиш додан
      </span>
    </button>

  </div>

</section>


<!-- PROFILE -->

<section
  id="profilePage"
  class="page"
>

  <div
    class="section-title"
    data-t="profile"
  >
    Профил
  </div>

  <div class="profile-card">

    <div class="profile-row">

      <button onclick="showOrders()">

        📦

        <span data-t="orders">
          Фармоишҳои ман
        </span>

      </button>

    </div>


    <div class="profile-row">

      <button onclick="changeLang()">

        🌐

        <span data-t="language">
          Забон
        </span>

        :

        <strong id="langName">
          Тоҷикӣ
        </strong>

      </button>

    </div>


    <div class="profile-row">

      <button onclick="goHome()">

        🏠

        <span data-t="home">
          Асосӣ
        </span>

      </button>

    </div>

  </div>


  <div
    id="ordersBox"
    style="margin-top:15px"
  ></div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button
    class="nav active"
    onclick="showPage('homePage',this)"
  >

    <span class="nav-icon">
      🏠
    </span>

    <span data-t="home">
      Асосӣ
    </span>

  </button>


  <button
    class="nav"
    onclick="showPage('favoritesPage',this)"
  >

    <span class="nav-icon">
      ❤️
    </span>

    <span data-t="favorites">
      Дӯстдошта
    </span>

  </button>


  <button
    class="nav"
    onclick="showPage('cartPage',this)"
  >

    <span class="nav-icon">
      🛒
    </span>

    <span data-t="cart">
      Сабад
    </span>

    <span
      id="cartBadge"
      class="badge"
    >
      0
    </span>

  </button>


  <button
    class="nav"
    onclick="showPage('profilePage',this)"
  >

    <span class="nav-icon">
      👤
    </span>

    <span data-t="profile">
      Профил
    </span>

  </button>

</nav>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>


<!-- ORDER MODAL -->

<div
  id="orderModal"
  class="modal-bg"
  onclick="closeModalOutside(event)"
>

  <div class="modal">

    <h3 data-t="orderTitle">
      Фармоиш
    </h3>


    <input
      id="customerName"
      type="text"
      placeholder="Ном"
      data-placeholder="name"
    >


    <input
      id="customerPhone"
      type="tel"
      placeholder="Телефон"
      data-placeholder="phone"
    >


    <input
      id="customerAddress"
      type="text"
      placeholder="Суроға"
      data-placeholder="address"
    >


    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeOrder()"
        data-t="cancel"
      >
        Бекор кардан
      </button>

      <button
        class="send"
        onclick="sendOrder()"
        data-t="send"
      >
        Ирсол кардан
      </button>

    </div>

  </div>

</div>

/* =========================
   VARIABLES
========================= */

let lang =
  localStorage.getItem("varzid_lang") || "tj";

let category = "all";

let cart =
  JSON.parse(
    localStorage.getItem("varzid_cart") || "[]"
  );

let favorites =
  JSON.parse(
    localStorage.getItem("varzid_favorites") || "[]"
  );

let orders =
  JSON.parse(
    localStorage.getItem("varzid_orders") || "[]"
  );


/* =========================
   TRANSLATION FUNCTION
========================= */

function t(key){

  return translations[lang][key] || key;

}


function productName(p){

  return p[lang] || p.tj;

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "varzid_cart",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "varzid_favorites",
    JSON.stringify(favorites)
  );

  localStorage.setItem(
    "varzid_orders",
    JSON.stringify(orders)
  );

}


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

  const box =
    document.getElementById("products");

  const empty =
    document.getElementById("empty");

  const searchInput =
    document.getElementById("search");

  const q =
    searchInput.value
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(p=>{

      const matchesCategory =
        category==="all" ||
        p.cat===category;


      const text =
        (
          p.tj+" "+
          p.ru+" "+
          p.uz
        ).toLowerCase();


      const matchesSearch =
        !q ||
        text.includes(q);


      return (
        matchesCategory &&
        matchesSearch
      );

    });


  box.innerHTML="";


  if(!filtered.length){

    empty.style.display="block";

    return;

  }


  empty.style.display="none";


  filtered.forEach(p=>{

    const fav =
      favorites.includes(p.id);

    const inCart =
      cart.includes(p.id);


    const card =
      document.createElement("div");

    card.className="product";


    card.innerHTML=`

      <div class="product-img">
        ${p.emoji}
      </div>

      <button
        class="heart"
        onclick="toggleFavorite(${p.id})"
      >
        ${fav ? "❤️" : "🤍"}
      </button>

      <div class="info">

        <div class="name">
          ${productName(p)}
        </div>

        ${
          p.noPrice
          ? ""
          :
          `
            <div class="price">
              ${p.price} ${t("som")}
            </div>
          `
        }

        <div
          class="stock ${
            p.stock>0
            ? "in"
            : "out"
          }"
        >

          ${
            p.stock>0
            ? "✓ "+t("inStock")
            : "✕ "+t("outStock")
          }

        </div>

        ${
          p.stock>0 && !p.noPrice

          ?

          `
            <button
              class="add ${
                inCart
                ? "added"
                : ""
              }"
              onclick="toggleCart(${p.id})"
            >

              ${
                inCart
                ? t("added")
                : t("add")
              }

            </button>
          `

          :

          ""
        }

      </div>

    `;


    box.appendChild(card);

  });

}


/* =========================
   CART
========================= */

function toggleCart(id){

  const index =
    cart.indexOf(id);


  if(index===-1){

    cart.push(id);

    showToast(
      "✓ "+t("addedToast")
    );

  }

  else{

    cart.splice(index,1);

    showToast(
      "✓ "+t("removedToast")
    );

  }


  save();

  updateCart();

  renderProducts();

  renderFavorites();

}


function updateCart(){

  const badge =
    document.getElementById("cartBadge");


  badge.textContent =
    cart.length;


  badge.style.display =
    cart.length
    ? "flex"
    : "none";


  renderCart();

}


function renderCart(){

  const box =
    document.getElementById("cartList");

  const empty =
    document.getElementById("cartEmpty");

  const bottom =
    document.getElementById("cartBottom");


  box.innerHTML="";


  if(!cart.length){

    empty.style.display="block";

    bottom.style.display="none";

    return;

  }


  empty.style.display="none";

  bottom.style.display="block";


  let total=0;


  cart.forEach(id=>{

    const p =
      products.find(
        x=>x.id===id
      );


    if(!p)return;


    total+=p.price;


    const item =
      document.createElement("div");

    item.className="cart-item";


    item.innerHTML=`

      <div class="cart-emoji">
        ${p.emoji}
      </div>

      <div class="cart-info">

        <div class="cart-name">
          ${productName(p)}
        </div>

        <div class="cart-price">
          ${p.price} ${t("som")}
        </div>

      </div>

      <button
        class="remove"
        onclick="toggleCart(${p.id})"
      >
        🗑️
      </button>

    `;


    box.appendChild(item);

  });


  document.getElementById("total")
    .textContent =
      total+" "+t("som");

}


/* =========================
   FAVORITES
========================= */

function toggleFavorite(id){

  const index =
    favorites.indexOf(id);


  if(index===-1){

    favorites.push(id);

    showToast("❤️");

  }

  else{

    favorites.splice(index,1);

    showToast("♡");

  }


  save();

  renderProducts();

  renderFavorites();

}

    const inCart =

        ${

          `
        }

          }"
        >

          ${
            p.stock>0
            ? "✓ "+t("inStock")
            : "✕ "+t("outStock")
          }

        </div>


        ${
          p.stock>0 && !p.noPrice

          ?

          `
            <button
              class="add ${
                inCart

                : ""
              }"
              onclick="toggleCart(${p.id})"
            >

              ${
                inCart
                ? t("added")
                : t("add")
              }

            </button>
          `

          :

          ""
        }

      </div>

    `;


    box.appendChild(card);

  });

/* =========================
   CATEGORY
========================= */

function setCategory(cat,btn){

  category=cat;


  document
    .querySelectorAll(".cat")
    .forEach(x=>
      x.classList.remove("active")
    );


  btn.classList.add("active");


  renderProducts();

}


/* =========================
   PAGES
========================= */

function showPage(id,btn){

  document
    .querySelectorAll(".page")
    .forEach(x=>
      x.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll(".nav")
    .forEach(x=>
      x.classList.remove("active")
    );


  btn.classList.add("active");


  if(id==="favoritesPage")
    renderFavorites();


  if(id==="cartPage")
    renderCart();


  if(id==="profilePage")
    document.getElementById("ordersBox").innerHTML="";

}


function goHome(){

  const nav =
    document.querySelector(".nav");


  showPage(
    "homePage",
    nav
  );

}


/* =========================
   TOAST
========================= */

function showToast(text){

  const toast =
    document.getElementById("toast");


  toast.textContent=text;

  toast.classList.add("show");


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },1800);

}


/* =========================
   THEME
========================= */

function toggleTheme(){

  document.body.classList.toggle("dark");


  localStorage.setItem(
    "varzid_theme",

    document.body.classList.contains("dark")
    ? "dark"
    : "light"
  );


  updateThemeIcon();

}


function updateThemeIcon(){

  const btn =
    document.getElementById(
      "themeBtn"
    );


  if(document.body.classList.contains("dark")){

    btn.textContent="☀️";

  }

  else{

    btn.textContent="🌙";

  }

}


/* =========================
   PHOTO
========================= */

function photoSelected(input){

  if(!input.files.length)
    return;


  showToast(
    "📷 "+t("photo")
  );

}


/* =========================
   ORDER MODAL
========================= */

function openOrder(){

  if(!cart.length){

    showToast(
      t("emptyCart")
    );

    return;

  }


  document
    .getElementById("orderModal")
    .classList.add("show");

}


function closeOrder(){

  document
    .getElementById("orderModal")
    .classList.remove("show");

}


function closeModalOutside(e){

  if(
    e.target===
    document.getElementById(
      "orderModal"
    )
  ){

    closeOrder();

  }

}


/* =========================
   SEND ORDER TO WHATSAPP
========================= */

function sendOrder(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  if(
    !name ||
    !phone ||
    !address
  ){

    showToast(
      t("fill")
    );

    return;

  }


  let total=0;


  let message =
    t("newOrder")
    + "\n\n";


  message +=
    t("customerName")
    + ": "
    + name
    + "\n";


  message +=
    t("customerPhone")
    + ": "
    + phone
    + "\n";


  message +=
    t("customerAddress")
    + ": "
    + address
    + "\n\n";


  message +=
    t("items")
    + "\n";


  cart.forEach(id=>{

    const p =
      products.find(
        x=>x.id===id
      );


    if(!p)return;


    total+=p.price;


    message +=
      productName(p)
      + " — "
      + p.price
      + " "
      + t("som")
      + "\n";

  });


  message +=
    "\n"
    + t("grandTotal")
    + " "
    + total
    + " "
    + t("som");


  /* SAVE ORDER */

  orders.unshift({

    id:Date.now(),

    name:name,

    phone:phone,

    address:address,

    products:[...cart],

    total:total

  });


  save();


  /*
    VARZID WHATSAPP
    Рақами соҳиби фармоиш:
    +992 000 001 606
  */

  const whatsapp =
    "https://wa.me/992000001606?text="
    +
    encodeURIComponent(message);


  closeOrder();


  cart=[];


  save();


  updateCart();

  renderProducts();

  renderFavorites();


  window.location.href =
    whatsapp;

}


/* =========================
   ORDERS
========================= */

function showOrders(){

  const box =
    document.getElementById(
      "ordersBox"
    );


  if(!orders.length){

    box.innerHTML=`

      <div
        class="empty"
        style="display:block"
      >

        📦

        ${t("noOrders")}

      </div>

    `;

    return;

  }


  box.innerHTML =
    orders.map(o=>`

      <div
        class="profile-card"
        style="margin-bottom:10px"
      >

        <b>

          📦

          ${t("orderWord")}

          #${o.id}

        </b>


        <p style="margin-top:8px">
          ${o.name}
        </p>


        <p
          style="
            color:var(--muted);
            margin-top:4px
          "
        >
          ${o.phone}
        </p>


        <p
          style="
            color:var(--muted);
            margin-top:4px
          "
        >
          ${o.address}
        </p>


        <p style="margin-top:8px">

          <b>
            ${o.total}
            ${t("som")}
          </b>

        </p>


        <button
          onclick="deleteOrder(${o.id})"
          style="
            margin-top:10px;
            border:0;
            padding:9px 12px;
            border-radius:9px;
            background:#fee;
            color:#c33;
          "
        >

          🗑️

          ${t("delete")}

        </button>

      </div>

    `).join("");

}


function deleteOrder(id){

  orders =
    orders.filter(
      x=>x.id!==id
    );


  save();

  showOrders();


  showToast(
    t("orderDeleted")
  );

}


/* =========================
   LANGUAGE
========================= */

function changeLang(){

  const next =
    lang==="tj"
    ? "ru"
    : lang==="ru"
    ? "uz"
    : "tj";


  lang=next;


  localStorage.setItem(
    "varzid_lang",
    lang
  );


  applyLanguage();

  renderProducts();

  renderFavorites();

  renderCart();

  showOrders();

}


/* =========================
   APPLY LANGUAGE
========================= */

function applyLanguage(){

  document
    .querySelectorAll("[data-t]")
    .forEach(el=>{

      const key =
        el.getAttribute("data-t");


      el.textContent =
        t(key);

    });


  document
    .getElementById("langName")
    .textContent =

      lang==="tj"
      ? "Тоҷикӣ"

      : lang==="ru"
      ? "Русский"

      : "O‘zbekcha";


  document
    .getElementById("search")
    .placeholder =
      t("search");


  document
    .getElementById("customerName")
    .placeholder =
      t("name");


  document
    .getElementById("customerPhone")
    .placeholder =
      t("phone");


  document
    .getElementById("customerAddress")
    .placeholder =
      t("address");

}


/* =========================
   INITIALIZATION
========================= */

function init(){

  const savedTheme =
    localStorage.getItem(
      "varzid_theme"
    );


  if(savedTheme==="dark"){

    document.body.classList.add("dark");

  }


  updateThemeIcon();

  applyLanguage();

  renderProducts();

  renderFavorites();

  updateCart();

}


init();
