<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <!-- Болои саҳифа / Header -->
    <header class="header">
        <div class="menu-container">
            <button id="menuToggle" class="menu-toggle">
                <span id="catMenuTitle">Интихоби категория</span>
                <span id="arrowIcon" class="arrow">▼</span>
            </button>
            <div id="dropdownMenu" class="dropdown-menu">
                <a href="#" id="catVarzidName">Варзидани</a>
            </div>
        </div>
        <button id="settingsIcon" class="settings-btn">⚙️</button>
    </header>

    <!-- Мундариҷаи асосӣ -->
    <main class="main-content">
        
        <!-- Профили ВАРЗИД бо услуби Instagram ва тугмаи обуна -->
        <div class="channel-profile-card">
            <div class="channel-info">
                <div class="instagram-logo-box">
                    <span class="insta-gradient-text">V</span>
                </div>
                <div class="channel-details">
                    <h2 id="channelName">ВАРЗИД</h2>
                    <div id="subCount">0 <span id="subTextLabel">обуначиён</span></div>
                </div>
            </div>
            <div class="sub-action-box">
                <button id="subBtn" class="sub-btn">Обуна шудан</button>
                <button id="bellBtn" class="bell-btn" title="Зангула">🔔</button>
            </div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <span id="postTime">Ҳоло</span>
            </div>
            <p id="postText">✅ <b>ЭЪЛОНИ НАВ</b><br>Молу маҳсулоти нав ва навори он:</p>
            
            <!-- Видео бозингар -->
            <div class="video-container">
                <video controls width="100%">
                    <source src="" type="video/mp4">
                    Видеворо дастгирӣ намекунад браузери шумо.
                </video>
            </div>

            <!-- Лайк ва реаксияҳо -->
            <div class="reactions">
                <button id="likeBtn">❤️ <span id="likeCount">0</span></button>
                <button id="loveBtn">🔥 <span id="loveCount">0</span></button>
            </div>
        </div>

        <!-- Қисми фармоиш / Заказ -->
        <div class="order-section">
            <h3 id="orderTitle">🛒 Заказ / Фармоиш</h3>
            <p id="orderDesc">Барои фармоиш ном ва рақами худро фиристед:</p>
            <form onsubmit="sendToWhatsApp(event)">
                <input type="text" id="clientName" placeholder="Номи шумо..." required>
                <input type="tel" id="clientPhone" placeholder="Рақами телефон (масалан: 900000000)..." required>
                <button type="submit" id="orderBtn" class="order-btn">📲 Фиристодани фармоиш ба WhatsApp</button>
            </form>
        </div>

        <!-- Поиск дар охир -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Ҷустуҷӯ дар сомона...">
        </div>
    </main>

    <!-- Танзимот (Модал) -->
    <div id="settingsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeSettings" class="close">&times;</span>
            <h2 id="settingsTitle">Танзимоти VARZID</h2>
            
            <div class="setting-group">
                <label id="themeLabel">Мавзӯи рангӣ:</label>
                <button onclick="setTheme('light')" id="lightText">Режими рӯзона</button>
                <button onclick="setTheme('dark')" id="darkText">Режими шабона</button>
            </div>

            <div class="setting-group">
                <label id="langLabel">Забон:</label>
                <button onclick="setLanguage('tg')">Тоҷикӣ</button>
                <button onclick="setLanguage('ru')">Русский</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
