<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="brand-container" id="brandToggle">
            <span class="brand-title">VARZID</span>
            <span class="arrow">▼</span>
        </div>
        <div class="subscribers-info">
            <span id="subCount">30000</span> подписчиков
            <button id="subBtn" class="sub-btn">Подписаться</button>
        </div>
    </header>

    <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-header">
            <span>Категории</span>
            <button id="addCategoryBtn" class="add-btn">+</button>
        </div>
        <ul id="categoryList">
            <li class="category-item">Варзид Орд</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
