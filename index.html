<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <header class="header">
        <div class="brand-selector" id="menuToggle">
            <span class="brand-title" id="channelName">Варзидан</span>
            <span class="arrow" id="arrowIcon">▼</span>
        </div>
        <div class="header-icons">
            <span class="icon" id="settingsIcon">⚙️</span>
        </div>
    </header>

    <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-header">
            <span>Выбор категории</span>
            <span class="close-btn" id="closeMenu">✕</span>
        </div>
        <div class="category-scroll-container">
            <div class="category-list" id="categoryList">
                <div class="category-item active" onclick="selectCategory(this, 'Варзидан')">Варзидан</div>
                <div class="category-item" onclick="selectCategory(this, 'Мука')">Мука</div>
                <div class="category-item" onclick="selectCategory(this, 'Комбикорм')">Комбикорм</div>
                <div class="category-item" onclick="selectCategory(this, 'Пшеница')">Пшеница</div>
                <div class="category-item" onclick="selectCategory(this, 'Ячмень')">Ячмень</div>
                <div class="category-item" onclick="selectCategory(this, 'Кукуруза')">Кукуруза</div>
                <div class="category-item" onclick="selectCategory(this, 'Селитра')">Селитра</div>
                <div class="category-item" onclick="selectCategory(this, 'Карбамид')">Карбамид</div>
            </div>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <h3>Настройки</h3>
                <span class="close-btn" id="closeSettings">✕</span>
            </div>
            <div class="settings-section">
                <label>Цветовая схема:</label>
                <div class="settings-options">
                    <button class="option-btn" onclick="setTheme('light')">☀️ Дневной режим</button>
                    <button class="option-btn" onclick="setTheme('dark')">🌙 Ночной режим</button>
                </div>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="post-card">
            <div class="post-header">
                <span class="post-time">Только что</span>
            </div>
            <div class="post-text" id="postText">
                ✅ <b>НОВЫЕ ОБЪЯВЛЕНИЯ</b><br>
                Различные товары и их видеоматериалы:
            </div>
            <div class="post-media-box">
                <video class="post-video" controls>
                    <source src="video.mp4" type="video/mp4">
                    Видео не поддерживается.
                </video>
            </div>
            <div class="post-footer">
                <button class="reaction-btn" id="likeBtn">👍 <span id="likeCount">0</span></button>
                <button class="reaction-btn" id="loveBtn">❤️ <span id="loveCount">0</span></button>
            </div>
        </div>

        <div class="order-section">
            <div class="order-box">
                <h3>🛒 Заказ</h3>
                <p>Отправьте свое имя и номер телефона для заказа:</p>
                <form id="orderForm" onsubmit="sendToWhatsApp(event)">
                    <input type="text" id="clientName" placeholder="Ваше имя..." required class="order-input">
                    <input type="tel" id="clientPhone" placeholder="Номер телефона (например: 900000000)..." required class="order-input">
                    <button type="submit" class="whatsapp-btn">📲 Отправить заказ в WhatsApp</button>
                </form>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
