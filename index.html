<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --green:#16833b;
 --green2:#0d6b2d;
 --bg:#f5f7f6;
 --card:#fff;
 --text:#172019;
 --muted:#718078;
 --border:#e3e9e5;
 --danger:#d92d20;
 --shadow:0 5px 20px rgba(0,0,0,.06);
}
body.dark{
 --bg:#101512;
 --card:#18201b;
 --text:#f2f6f3;
 --muted:#aab6ae;
 --border:#29352e;
 --shadow:0 5px 20px rgba(0,0,0,.25);
}
body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 padding-bottom:82px;
 transition:.2s;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.header{
 position:sticky;top:0;z-index:20;
 background:var(--card);
 border-bottom:1px solid var(--border);
 padding:12px 15px;
}
.top{
 display:flex;align-items:center;justify-content:space-between;
 max-width:900px;margin:auto;
}
.logo{
 display:flex;align-items:center;gap:9px;
 font-size:23px;font-weight:900;color:var(--green);
}
.logoMark{
 width:38px;height:38px;border-radius:50%;
 border:4px solid var(--green);
 display:flex;align-items:center;justify-content:center;
 font-size:14px;
}
.top button{
 background:var(--bg);color:var(--text);
 width:40px;height:40px;border-radius:50%;
}
.search{
 max-width:900px;margin:12px auto 0;
 position:relative;
}
.search input{
 width:100%;height:45px;border:1px solid var(--border);
 background:var(--bg);color:var(--text);
 border-radius:13px;padding:0 15px 0 43px;outline:none;
}
.search span{
 position:absolute;left:15px;top:12px;font-size:18px;
}
.container{max-width:900px;margin:auto;padding:15px}
.hero{
 background:linear-gradient(135deg,#16833b,#54b86f);
 color:white;border-radius:20px;padding:22px;margin-bottom:18px;
}
.hero h1{font-size:25px;margin-bottom:7px}
.hero p{opacity:.9;font-size:14px}
.sectionHead{
 display:flex;align-items:center;justify-content:space-between;
 margin:20px 0 12px;
}
.sectionHead h2{font-size:19px}
.categories{
 display:grid;grid-template-columns:repeat(4,1fr);gap:9px;
}
.cat{
 background:var(--card);border:1px solid var(--border);
 border-radius:15px;padding:13px 5px;text-align:center;
 color:var(--text);box-shadow:var(--shadow);
}
.cat .ico{font-size:26px;margin-bottom:6px}
.cat small{font-size:11px}
.products{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
.product{
 background:var(--card);border:1px solid var(--border);
 border-radius:17px;overflow:hidden;box-shadow:var(--shadow);
 position:relative;
}
.productImg{
 width:100%;height:155px;object-fit:cover;
 background:#eef2ef;display:block;
 cursor:pointer;
}
.heart{
 position:absolute;right:9px;top:9px;
 width:35px;height:35px;border-radius:50%;
 background:rgba(255,255,255,.94);
 font-size:19px;
}
.heart.active{color:#e32645}
.productInfo{padding:11px}
.productName{font-weight:700;margin-bottom:6px}
.price{font-size:17px;font-weight:800;color:var(--green)}
.unit{font-size:11px;color:var(--muted)}
.stock{
 display:inline-block;margin-top:7px;
 padding:4px 7px;border-radius:7px;
 font-size:11px;font-weight:bold;
}
.stock.ok{background:#e5f7ea;color:#16833b}
.stock.no{background:#ffe7e5;color:#d92d20}
.add{
 width:100%;margin-top:9px;padding:10px;
 border-radius:10px;background:var(--green);color:white;
 font-weight:bold;
}
.add:disabled{background:#8c9790;cursor:not-allowed}
.empty{
 text-align:center;padding:45px 15px;color:var(--muted);
}
.bottom{
 position:fixed;left:0;right:0;bottom:0;z-index:30;
 background:var(--card);border-top:1px solid var(--border);
 display:flex;justify-content:center;
}
.nav{
 width:100%;max-width:600px;
 display:grid;grid-template-columns:repeat(4,1fr);
}
.nav button{
 background:none;color:var(--muted);padding:10px 3px 8px;
 font-size:11px;
}
.nav button b{display:block;font-size:21px;margin-bottom:3px}
.nav button.active{color:var(--green)}
.badge{
 position:absolute;margin:-5px 0 0 -7px;
 background:#e32645;color:#fff;border-radius:20px;
 font-size:9px;padding:2px 5px;
}
.page{display:none}
.page.active{display:block}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:16px;padding:15px;margin-bottom:12px;
}
.profileRow{
 display:flex;align-items:center;justify-content:space-between;
 padding:14px 0;border-bottom:1px solid var(--border);
}
.profileRow:last-child{border-bottom:0}
select{
 background:var(--bg);color:var(--text);
 border:1px solid var(--border);padding:9px;border-radius:9px;
}
.cartItem{
 display:flex;gap:10px;padding:12px 0;
 border-bottom:1px solid var(--border);
}
.cartItem img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.cartInfo{flex:1}
.qty{
 display:flex;align-items:center;gap:8px;margin-top:7px;
}
.qty button{
 width:28px;height:28px;border-radius:8px;
 background:var(--bg);color:var(--text);
}
.total{
 display:flex;justify-content:space-between;
 font-size:19px;font-weight:800;margin:15px 0;
}
.primary{
 width:100%;padding:13px;border-radius:12px;
 background:var(--green);color:white;font-weight:bold;
}
.secondary{
 width:100%;padding:12px;border-radius:12px;
 background:var(--bg);color:var(--text);
 margin-top:8px;
}
.order{
 border:1px solid var(--border);border-radius:12px;
 padding:12px;margin-top:10px;
}
.orderStatus{color:var(--green);font-size:13px;font-weight:bold}
.viewer{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);
 z-index:100;align-items:center;justify-content:center;
}
.viewer.show{display:flex}
.viewer img{max-width:94%;max-height:82%;object-fit:contain}
.closeViewer{
 position:absolute;right:18px;top:18px;
 width:42px;height:42px;border-radius:50%;
 background:white;font-size:24px;
}
.viewerArrow{
 position:absolute;top:50%;transform:translateY(-50%);
 width:42px;height:42px;border-radius:50%;
 background:white;font-size:22px;
}
.prev{left:12px}.next{right:12px}
.modal{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.55);z-index:90;
 align-items:flex-end;
}
.modal.show{display:flex}
.modalBox{
 width:100%;max-height:90vh;overflow:auto;
 background:var(--card);border-radius:22px 22px 0 0;
 padding:18px;max-width:600px;margin:auto;
}
.modalHead{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:15px;
}
.close{background:var(--bg);color:var(--text);
 width:35px;height:35px;border-radius:50%}
.form input,.form textarea{
 width:100%;padding:12px;margin-bottom:10px;
 border:1px solid var(--border);border-radius:10px;
 background:var(--bg);color:var(--text);outline:none;
}
.form textarea{height:80px;resize:none}
.langs{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.langBtn{
 padding:11px 4px;border-radius:10px;
 background:var(--bg);color:var(--text);
 border:1px solid var(--border);
}
.langBtn.active{background:var(--green);color:white}
@media(min-width:650px){
 .products{grid-template-columns:repeat(4,1fr)}
 .productImg{height:180px}
}
</style>
</head>

</main>

</nav>

  "Витаминҳо":{ru:"Витамины",uz:"Vitaminlar"},
  "Асбоби кишоварзӣ":{ru:"Сельхозинструмент",uz:"Qishloq xo‘jaligi asbobi"}
 };
 return lang==="tg"?p.name:(names[p.name]?.[lang]||p.name);
}

function productCategory(p){
 if(lang==="tg")return p.category;
 if(p.category==="Кишоварзӣ")return t("agriculture");
 if(p.category==="Сабзавот")return t("vegetables");
 if(p.category==="Витаминҳо")return t("vitamins");
 return t("equipment");
}

function unitText(unit){
 if(unit==="кг")return t("kg");
 if(unit==="халта")return t("bag");
 return t("piece");
}

function renderProducts(){
 const box=document.getElementById("products");
 const q=document.getElementById("searchInput").value.toLowerCase();

 let list=products.filter(p=>{
  const categoryOK=currentCategory==="Ҳама"||p.category===currentCategory;
  const searchOK=
   productName(p).toLowerCase().includes(q)||
   p.name.toLowerCase().includes(q);
  return categoryOK&&searchOK;
 });

 if(!list.length){
  box.innerHTML=`<div class="empty" style="grid-column:1/-1">😕</div>`;
  return;
 }

 box.innerHTML=list.map(p=>productCard(p)).join("");
}

function productCard(p){
 const fav=favorites.includes(p.id);
 const available=p.stock>0;

 return `
 <article class="product">
   <img class="productImg"
    src="${p.images[0]}"
    onclick="openViewer(${p.id})"
    onerror="this.src='https://via.placeholder.com/600x400?text=VARZID'">

   <button class="heart ${fav?"active":""}"
    onclick="toggleFavorite(${p.id})">
    ${fav?"♥":"♡"}
   </button>

   <div class="productInfo">
    <div class="productName">${productName(p)}</div>
    <div class="unit">${productCategory(p)} · ${unitText(p.unit)}</div>
    <div class="price">${p.price} сомонӣ</div>

    <span class="stock ${available?"ok":"no"}">
     ${available?"✓ "+t("available"):"− "+t("out")}
    </span>

    <button class="add"
     ${available?"":"disabled"}
     onclick="addToCart(${p.id})">
     ${available?t("add"):t("out")}
    </button>
   </div>
 </article>`;
}

function toggleFavorite(id){
 if(favorites.includes(id))
  favorites=favorites.filter(x=>x!==id);
 else favorites.push(id);

 save();
 renderProducts();
 renderFavorites();
}

function renderFavorites(){
 const box=document.getElementById("favorites");
 const list=products.filter(p=>favorites.includes(p.id));

 if(!list.length){
  box.innerHTML=`<div class="empty" style="grid-column:1/-1">♡<br>${t("favoritesEmpty")}</div>`;
  return;
 }
 box.innerHTML=list.map(p=>productCard(p)).join("");
}

function addToCart(id){
 const p=products.find(x=>x.id===id);
 if(!p||p.stock<=0)return;

 const item=cart.find(x=>x.id===id);
 if(item){
  if(item.qty<p.stock)item.qty++;
 }else{
  cart.push({id,qty:1});
 }

 save();
 renderCart();
 updateBadge();
}

function changeQty(id,d){
 const item=cart.find(x=>x.id===id);
 const p=products.find(x=>x.id===id);
 if(!item||!p)return;

 item.qty+=d;

 if(item.qty<=0)
  cart=cart.filter(x=>x.id!==id);

 if(item.qty>p.stock)
  item.qty=p.stock;

 save();
 renderCart();
 updateBadge();
}

function renderCart(){
 const box=document.getElementById("cart");

 if(!cart.length){
  box.innerHTML=`<div class="empty">🛒<br>${t("cartEmpty")}</div>`;
  return;
 }

 let total=0;

 let html=cart.map(item=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return "";

  total+=p.price*item.qty;

  return `
  <div class="card cartItem">
   <img src="${p.images[0]}">
   <div class="cartInfo">
    <b>${productName(p)}</b>
    <div class="unit">${p.price} сомонӣ / ${unitText(p.unit)}</div>
    <div class="qty">
     <button onclick="changeQty(${p.id},-1)">−</button>
     <b>${item.qty}</b>
     <button onclick="changeQty(${p.id},1)"
      ${item.qty>=p.stock?"disabled":""}>+</button>
    </div>
   </div>
   <b>${p.price*item.qty} с.</b>
  </div>`;
 }).join("");

 html+=`
 <div class="card">
  <div class="total">
   <span>${t("total")}</span>
   <span>${total} сомонӣ</span>
  </div>
  <button class="primary" onclick="openOrder()">
   ${t("order")}
  </button>
 </div>`;

 box.innerHTML=html;
}

function updateBadge(){
 document.getElementById("cartBadge").textContent=
  cart.reduce((a,b)=>a+b.qty,0);
}

function filterCategory(c){
 currentCategory=c;
 go("homePage",document.querySelector(".nav button"));
 renderProducts();
 window.scrollTo({top:0,behavior:"smooth"});
}

function go(page,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(page).classList.add("active");

 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");

 if(page==="favoritesPage")renderFavorites();
 if(page==="cartPage")renderCart();
 if(page==="profilePage")showOrders();

 window.scrollTo({top:0,behavior:"smooth"});
}

function openViewer(id){
 viewerProduct=products.find(x=>x.id===id);
 viewerIndex=0;

 if(!viewerProduct)return;

 document.getElementById("viewerImg").src=
  viewerProduct.images[viewerIndex];

 document.getElementById("viewer").classList.add("show");
}

function changeImage(d){
 if(!viewerProduct)return;

 viewerIndex+=d;

 if(viewerIndex<0)
  viewerIndex=viewerProduct.images.length-1;

 if(viewerIndex>=viewerProduct.images.length)
  viewerIndex=0;

 document.getElementById("viewerImg").src=
  viewerProduct.images[viewerIndex];
}

function closeViewer(){
 document.getElementById("viewer").classList.remove("show");
}

function openOrder(){
 if(!cart.length)return;
 document.getElementById("orderModal").classList.add("show");
}

function closeOrder(){
 document.getElementById("orderModal").classList.remove("show");
}

function submitOrder(method){
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const address=document.getElementById("address").value.trim();
 const comment=document.getElementById("comment").value.trim();

 if(!name||!phone||!address){
  alert(lang==="tg"?
   "Лутфан Ном, Телефон ва Суроғаро пур кунед.":
   lang==="ru"?
   "Пожалуйста, заполните имя, телефон и адрес.":
   "Iltimos, ism, telefon va manzilni kiriting.");
  return;
 }

 const items=cart.map(item=>{
  const p=products.find(x=>x.id===item.id);
  return {
   name:p.name,
   qty:item.qty,
   price:p.price
  };
 });

 const order={
  id:Date.now(),
  date:new Date().toLocaleString(),
  name,phone,address,comment,method,items
 };

 orders.unshift(order);
 save();

 if(method==="whatsapp"){
  let text=
   `VARZID - ${t("order")}\n`+
   `${t("name")}: ${name}\n`+
   `${t("phone")}: ${phone}\n`+
   `${t("address")}: ${address}\n\n`;

  cart.forEach(item=>{
   const p=products.find(x=>x.id===item.id);
   text+=`${p.name} × ${item.qty} = ${p.price*item.qty} сомонӣ\n`;
  });

  window.open(
   "https://wa.me/992000001606?text="+encodeURIComponent(text),
   "_blank"
  );
 }else{
  alert(t("orderAccepted"));
 }

 cart=[];
 save();
 closeOrder();
 renderCart();
 updateBadge();
 showOrders();

 document.getElementById("name").value="";
 document.getElementById("phone").value="";
 document.getElementById("address").value="";
 document.getElementById("comment").value="";
}

function showOrders(){
 const box=document.getElementById("ordersBox");

 if(!orders.length){
  box.innerHTML=`<div class="card empty">${t("noOrders")}</div>`;
  return;
 }

 box.innerHTML=orders.map(o=>`
  <div class="card order">
   <b>#${String(o.id).slice(-5)}</b>
   <div style="color:var(--muted);font-size:12px;margin:5px 0">
    ${o.date}
   </div>
   <div>${o.name} · ${o.phone}</div>
   <div>${o.address}</div>
   <div class="orderStatus">✓ ${t("orderAccepted")}</div>
   <button class="secondary"
    onclick="deleteOrder(${o.id})">${t("delete")}</button>
  </div>
 `).join("");
}

function deleteOrder(id){
 orders=orders.filter(o=>o.id!==id);
 save();
 showOrders();
}

function toggleTheme(){
 document.body.classList.toggle("dark");
 const dark=document.body.classList.contains("dark");
 localStorage.setItem("varzid_theme",dark?"dark":"light");
 updateThemeText();
}

function updateThemeText(){
 const dark=document.body.classList.contains("dark");
 document.getElementById("themeBtn").textContent=dark?"🌙":"☀️";
 document.getElementById("themeText").textContent=dark?t("night"):t("day");
}

function loadTheme(){
 if(localStorage.getItem("varzid_theme")==="dark")
  document.body.classList.add("dark");
}

loadTheme();
applyLanguage();
renderProducts();
renderFavorites();
renderCart();
updateBadge();
showOrders();
</script>

</body>
</html>
