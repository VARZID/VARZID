<!DOCTYPE html>
<html lang="tg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VARZID</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="light-theme">


<header class="header">

    <div class="header-top">


        <!-- BRAND -->
        <div
            class="brand-container"
            id="brandToggle"
        >

            <span>VARZID</span>

            <svg
                class="arrow-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M6 9l6 6 6-6"></path>
            </svg>

        </div>


        <!-- MODERN PROFILE + SETTINGS -->
        <button
            class="settings-icon"
            id="settingsToggle"
            aria-label="Танзимот"
        >

            <svg
                viewBox="0 0 32 32"
                aria-hidden="true"
            >

                <!-- одамча -->
                <circle
                    cx="13"
                    cy="10"
                    r="3.8"
                ></circle>

                <path
                    d="M6.5 22.5c.7-3.8 2.8-5.8 6.5-5.8s5.8 2 6.5 5.8"
                ></path>


                <!-- чархи танзимот дар дохили сина/шикам -->
                <circle
                    class="settings-gear"
                    cx="13"
                    cy="20"
                    r="3.7"
                ></circle>

                <path
                    class="settings-gear"
                    d="
                        M13 14.9v1.3
                        M13 23.8v1.3
                        M7.9 20h1.3
                        M16.8 20h1.3
                        M9.4 16.4l.9.9
                        M15.7 22.7l.9.9
                        M16.6 16.4l-.9.9
                        M10.3 22.7l-.9.9
                    "
                ></path>

            </svg>

        </button>

    </div>


    <!-- BRAND DROPDOWN -->
    <div
        class="dropdown-menu"
        id="dropdownMenu"
    >

        <div class="subscribers-info">

            <div class="subscriber-text">

                <span id="subCount">
                    0
                </span>

                <span data-i18n="subscribers">
                    обуна
                </span>

            </div>


            <button
                class="sub-btn"
                id="subBtn"
                data-i18n="subscribe"
            >
                Обуна шудан
            </button>

        </div>


        <div class="menu-header">

            <span data-i18n="categories">
                Категорияҳо
            </span>

            <button
                class="add-btn"
                id="addCategoryBtn"
                aria-label="Илова"
            >
                +
            </button>

        </div>


        <div
            class="categories-grid"
            id="categoryList"
        ></div>

    </div>


    <!-- SETTINGS -->
    <div
        class="settings-menu"
        id="settingsMenu"
    >

        <div class="settings-header">

            <h3 data-i18n="settings">
                Танзимот
            </h3>

            <button
                class="close-small"
                id="closeSettingsHeader"
            >
                ×
            </button>

        </div>


        <div class="settings-body">


            <!-- THEME -->
            <div
                class="setting-item"
                id="themeToggle"
            >

                <span data-i18n="theme">
                    Мавзӯъ
                </span>

                <span
                    class="settings-value"
                    id="themeValue"
                >
                    Сафед
                </span>

            </div>


            <!-- NOTIFICATIONS -->
            <div
                class="setting-item"
                id="notificationToggle"
            >

                <span data-i18n="notifications">
                    Огоҳиномаҳо
                </span>

                <span
                    class="badge-on"
                    id="notificationStatus"
                >
                    ON
                </span>

            </div>


            <!-- LANGUAGE -->
            <div
                class="setting-item"
                id="languageToggle"
            >

                <span data-i18n="language">
                    Забон
                </span>

                <span
                    class="settings-value"
                    id="languageValue"
                >
                    Тоҷикӣ
                </span>

            </div>


            <!-- ADMIN -->
            <div
                class="setting-item"
                id="adminModeToggle"
                data-admin-link="admin.html"
            >

                <span>
                    Admin
                </span>

                <span class="settings-value">
                    →
                </span>

            </div>


        </div>

    </div>

</header>



<!-- THEME MODAL -->
<div
    class="theme-modal"
    id="themeModal"
>

    <div class="theme-modal-content">

        <h3 data-i18n="chooseTheme">
            Мавзӯъро интихоб кунед
        </h3>


        <div
            class="theme-option"
            data-theme="light"
        >
            Сафед
        </div>


        <div
            class="theme-option"
            data-theme="dark"
        >
            Торик
        </div>


        <div
            class="theme-option"
            data-theme="system"
        >
            Системавӣ
        </div>


        <button
            class="theme-cancel"
            id="themeCancel"
            data-i18n="cancel"
        >
            Бекор кардан
        </button>

    </div>

</div>



<!-- LANGUAGE MODAL -->
<div
    class="theme-modal"
    id="languageModal"
>

    <div class="theme-modal-content">

        <h3>
            Забон
        </h3>


        <div
            class="theme-option language-option"
            data-lang="tg"
        >
            Тоҷикӣ
        </div>


        <div
            class="theme-option language-option"
            data-lang="ru"
        >
            Русский
        </div>


        <div
            class="theme-option language-option"
            data-lang="uz"
        >
            O‘zbekcha
        </div>


        <button
            class="theme-cancel"
            id="languageCancel"
        >
            Бекор кардан
        </button>

    </div>

</div>



<!-- PRODUCTS -->
<main
    class="products-area"
    id="productsArea"
>

    <div
        class="products-header"
        id="productsHeader"
    >

        <h2 id="currentCategoryTitle">
            Варзидан
        </h2>

    </div>


    <div
        class="product-grid"
        id="productGrid"
    ></div>

</main>



<!-- CART -->
<div
    class="cart-panel"
    id="cartPanel"
>

    <div class="cart-header">

        <h3 data-i18n="cart">
            Сабад
        </h3>

        <button
            class="cart-close"
            id="cartClose"
        >
            ×
        </button>

    </div>


    <div
        class="cart-items"
        id="cartItems"
    ></div>


    <div
        class="cart-empty"
        id="cartEmpty"
        data-i18n="cartEmpty"
    >
        Сабад холӣ аст.
    </div>


    <div class="cart-footer">

        <div class="cart-total-row">

            <span data-i18n="total">
                Ҳамагӣ
            </span>

            <strong>
                <span id="cartTotal">
                    0
                </span>
                сомонӣ
            </strong>

        </div>


        <button
            class="buy-cart-btn"
            id="buyCartBtn"
            data-i18n="order"
        >
            Фармоиш диҳед
        </button>

    </div>

</div>



<!-- BOTTOM NAV -->
<nav class="bottom-nav">


    <!-- HOME -->
    <button
        class="bottom-nav-btn active"
        id="homeBtn"
        aria-label="Асосӣ"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M3 10.5L12 3l9 7.5"
            ></path>

            <path
                d="M5.5 9.5V21h13V9.5"
            ></path>

            <path
                d="M9.5 21v-6h5v6"
            ></path>

        </svg>

    </button>



    <!-- FAVORITES -->
    <button
        class="bottom-nav-btn"
        id="favoritesBtn"
        aria-label="Дӯстдоштаҳо"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M20.8 8.7c0 5-8.8 11-8.8 11s-8.8-6-8.8-11A4.7 4.7 0 0 1 12 5.4a4.7 4.7 0 0 1 8.8 3.3z"
            ></path>

        </svg>

    </button>



    <!-- CART -->
    <button
        class="bottom-nav-btn"
        id="cartBtn"
        aria-label="Сабад"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6"
            ></path>

            <circle
                cx="10"
                cy="20"
                r="1"
            ></circle>

            <circle
                cx="18"
                cy="20"
                r="1"
            ></circle>

        </svg>


        <span
            class="cart-count"
            id="cartCount"
        >
            0
        </span>

    </button>

</nav>



<script src="script.js"></script>

</body>
</html>
