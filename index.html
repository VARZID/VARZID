<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varzid</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #22c55e;
            --accent-hover: #16a34a;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --surface-hover: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #16a34a;
            --accent-hover: #15803d;
            --danger-color: #dc2626;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .front-toggle-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .front-toggle-btn:hover {
            background-color: var(--surface-hover);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: var(--surface-hover);
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .categories-container {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .category-chip.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .admin-plus-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .admin-plus-btn.visible {
            display: inline-flex;
        }

        .delete-cat {
            color: var(--danger-color);
            margin-left: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        main {
            flex: 1;
            padding: 16px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .empty-state {
            color: var(--text-secondary);
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            padding: 20px;
        }

        .modal-header {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-control {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-secondary {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .settings-option {
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">VARZID <span>^</span></div>
            <button class="front-toggle-btn" onclick="selectCategory('all')">
                <span>+</span> <span>Для вас</span>
            </button>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="settingsBtn" title="Настройки">
                <svg class="icon-svg" viewBox="0 0 24 24">
                    <path d="M12 2C9.24 2 7 4.24 7 7c0 2.76 2.24 5 5 5s5-2.24 5-5c0-2.76-2.24-5-5-5zM12 10c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm6 6v-1.1c-.83-.52-1.83-.9-3-.9-1.17 0-2.17.38-3 .9V16h-4v2h10v-2h-4zm-10 1.25c.67-.47 1.5-.75 2.5-.75s1.83.28 2.5.75V19H8v-1.75zM20 10.5v1.8l-1.46.3c-.11.39-.28.75-.5 1.08l1.02 1.08-1.27 1.27-1.08-1.02c-.33.22-.69.39-1.08.5l-.3 1.46h-1.8l-.3-1.46c-.39-.11-.75-.28-1.08-.5l-1.08 1.02-1.27-1.27 1.02-1.08c-.22-.33-.39-.69-.5-1.08L4 12.3v-1.8l1.46-.3c.11-.39.28-.75.5-1.08L4.94 8.04l1.27-1.27 1.08 1.02c.33-.22.69-.39 1.08-.5l.3-1.46h1.8l.3 1.46c.39.11.75.28 1.08.5l1.08-1.02 1.27 1.27-1.02 1.08c.22.33.39.69.5 1.08L20 10.5z"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="categories-container" id="categoriesContainer">
        <button class="admin-plus-btn" id="adminPlusBtn" onclick="openAddModal()" title="Добавить">+</button>
    </div>

    <main>
        <div class="products-grid" id="productsGrid">
            <div class="empty-state">Ҳоло ягон категория ё мол нест.</div>
        </div>
    </main>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <span>Танзимот / Настройки</span>
                <button class="icon-btn" onclick="closeModal('settingsModal')">&times;</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="settings-option">
                    <span>Режими шабона</span>
                    <input type="checkbox" id="themeCheck" checked style="width: 18px; height: 18px; accent-color: var(--accent-color);">
                </div>
                <div style="border-top: 1px solid var(--border-color);"></div>
                <div class="form-group">
                    <label>Режими Админ (Парол)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="password" class="form-control" id="adminPassInput" placeholder="Парол: 1234" style="flex: 1;">
                        <button class="btn btn-primary" onclick="checkAdmin()">Вход</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <span>Илова кардани категория (Админ)</span>
                <button class="icon-btn" onclick="closeModal('addModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Номи категория</label>
                <input type="text" class="form-control" id="newCatName" placeholder="Ном...">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addModal')">Бекор</button>
                <button class="btn btn-primary" onclick="saveNewCategory()">Илова</button>
            </div>
        </div>
    </div>

    <script>
        let isAdmin = false;
        let currentCat = 'all';
        let categories = [];
        let products = [];

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const addModal = document.getElementById('addModal');
        const themeCheck = document.getElementById('themeCheck');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const adminPlusBtn = document.getElementById('adminPlusBtn');
        const productsGrid = document.getElementById('productsGrid');

        settingsBtn.addEventListener('click', () => settingsModal.classList.add('open'));

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        themeCheck.addEventListener('change', () => {
            document.documentElement.setAttribute('data-theme', themeCheck.checked ? 'dark' : 'light');
        });

        function checkAdmin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === '1234') {
                isAdmin = true;
                adminPlusBtn.classList.add('visible');
                closeModal('settingsModal');
                alert('Режими админ фаъол шуд!');
                renderCategories();
            } else {
                alert('Пароли нодуруст!');
            }
        }

        function openAddModal() {
            if (!isAdmin) return;
            document.getElementById('newCatName').value = '';
            addModal.classList.add('open');
        }

        function saveNewCategory() {
            const name = document.getElementById('newCatName').value.trim();
            if (name && !categories.includes(name)) {
                categories.push(name);
                closeModal('addModal');
                renderCategories();
            }
        }

        function deleteCategory(name, event) {
            event.stopPropagation();
            if (!isAdmin) return;
            categories = categories.filter(c => c !== name);
            if (currentCat === name) currentCat = 'all';
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            let html = '';
            categories.forEach(c => {
                const active = currentCat === c ? 'active' : '';
                html += `<button class="category-chip ${active}" onclick="selectCategory('${c}')">
                    ${c}
                    ${isAdmin ? `<span class="delete-cat" onclick="deleteCategory('${c}', event)">&times;</span>` : ''}
                </button>`;
            });
            categoriesContainer.innerHTML = html;
            categoriesContainer.appendChild(adminPlusBtn);
        }

        function selectCategory(cat) {
            currentCat = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            let filtered = currentCat === 'all' 
                ? products 
                : products.filter(p => p.cat === currentCat);

            if (filtered.length === 0) {
                productsGrid.innerHTML = `<div class="empty-state">Холӣ аст.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(p => {
                html += `
                    <div style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px;">
                        <div style="font-weight: 600;">${p.name}</div>
                        <div style="color: var(--accent-color);">${p.price}</div>
                    </div>
                `;
            });
            productsGrid.innerHTML = html;
        }

        renderCategories();
        renderProducts();
    </script>
</body>
</html>
