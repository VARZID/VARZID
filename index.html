<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Сарлавҳаи асосӣ -->
        <header class="header">
            <div class="brand-section">
                <span class="brand-title">VARZID</span>
                <span class="verified-icon">✔</span>
            </div>
            <div class="subscription-box">
                <span id="subCount">1.2 млн</span>
                <button id="subscribeBtn" onclick="toggleSubscribe()">Подписаться</button>
            </div>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </header>

        <!-- Қатори санаҳо -->
        <div class="dates-bar">
            <div class="date-item">07.09</div>
            <div class="date-item">08.09</div>
            <div class="date-item active">09.09 (СЕГОДНЯ)</div>
            <div class="date-item">10.09</div>
            <div class="date-item">11.09</div>
        </div>

        <!-- Қисми илова кардани панели маҳсулоти нав -->
        <div class="add-section">
            <input type="text" id="panelInput" placeholder="Номи маҳсулоти нав...">
            <button class="add-btn" onclick="addPanel()">+</button>
        </div>

        <!-- Рӯйхати маҳсулот ва панелҳо -->
        <div class="panels-container" id="panelsList">
            <!-- Панелҳо аз JavaScript ворид мешаванд -->
        </div>
    </div>

    <!-- Окнаи Танзимот (Settings Modal) -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h3>Настройки VARZID</h3>
            <ul>
                <li>Настройки уведомлений</li>
                <li onclick="toggleTheme()">Дневной режим / Ночной режим</li>
                <li>Оцените приложение</li>
                <li>Изменить язык</li>
                <li>Напишите нам</li>
            </ul>
            <button class="close-modal-btn" onclick="closeSettings()">Аз кор баромадан</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
