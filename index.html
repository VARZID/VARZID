<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID</title>
    <!-- Рамзи логотип дар сарлавҳаи браузер (Favicon) -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        /* Сарлавҳаи боло: VARZID, Зангула, Поиски хурд ва Танзимот дар як сатр */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 5px;
            margin-bottom: 8px;
            gap: 10px;
        }
        .varzid-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            cursor: pointer;
            color: #00d2ff;
        }
        .top-right-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bell-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
        /* Поиски хурди зебо мисли Flashscore */
        .search-box {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border-radius: 20px;
            padding: 3px 8px;
            border: 1px solid #444;
        }
        .search-input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 12px;
            width: 65px;
            transition: width 0.3s ease;
        }
        .search-input:focus {
            width: 105px;
        }
        .search-btn {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
        }
        .settings-btn {
            font-size: 18px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px;
        }

        /* Блоки профили асосӣ ва тугмаи сабз */
        .profile-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Логотипи обӣ дар ҷои аватар */
        .avatar-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00d2ff;
        }
        .btn-subscribe {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-subscribe.subscribed {
            background-color: #2a2a2a;
            color: #aaa;
        }

        /* Карточкаҳо ва видео */
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }
        input.form-control {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-wa {
            background: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Сарлавҳаи боло: VARZID, Зангула, Поиск ва Танзимот -->
    <div class="top-bar">
        <div class="varzid-title" onclick="alert('Менюи асосии VARZID')">
            VARZID <span>▼</span>
        </div>
        <div class="top-right-tools">
            <button class="bell-btn" title="Огоҳиномаҳо" onclick="alert('Зангула фаъол аст! Шумо аз маҳсулоти нав огоҳ мешавед.')">🔔</button>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Ҷустуҷӯ...">
                <button class="search-btn" onclick="performSearch()">🔍</button>
            </div>
            <button class="settings-btn" title="Танзимот" onclick="alert('Танзимоти сомонаи VARZID')">⚙️</button>
        </div>
    </div>

    <!-- Блоки профили VARZID бо Логотипи Нав ва тугмаи сабзи обуна -->
    <div class="profile-card">
        <div class="profile-left">
            <img src="logo.png" alt="VARZID Logo" class="avatar-logo">
            <div>
                <div style="font-weight: bold; font-size: 16px;">VARZID</div>
                <div style="font-size: 12px; color: #aaa;" id="subCountText">0 обуначӣ</div>
            </div>
        </div>
        <button id="subBtn" class="btn-subscribe" onclick="toggleSubscribe()">Обуна шудан</button>
    </div>

    <!-- Эълони нав ва навори молу маҳсулот -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 8px;">
            <span>VARZID</span>
            <span>Ҳоло</span>
        </div>
        <div>
            ✅ <b>ЭЪЛОНИ НАВ</b><br>
            Молу маҳсулоти нав ва навори он:
        </div>
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Видео дастгирӣ намешавад.
        </video>
        <div style="margin-top: 10px; font-size: 14px; color: #ccc;">
            👍 0 &nbsp;&nbsp;&nbsp; ❤️ 0
        </div>
    </div>

    <!-- Бахши Фармоиш -->
    <div class="card">
        <h3 style="margin-top: 0; margin-bottom: 5px;">🛒 Заказ / Фармоиш</h3>
        <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Барои фармоиш ном ва рақами худро фиристед:</p>
        <input type="text" class="form-control" placeholder="Номи шумо...">
        <input type="tel" class="form-control" placeholder="Рақами телефон (масалан: 900000000)...">
        <button class="btn-wa">📲 Фиристодани фармоиш ба WhatsApp</button>
    </div>

    <script>
        // Нигоҳ доштани хотираи обуна шудан дар браузер
        window.onload = function() {
            if (localStorage.getItem('varzid_permanent_sub') === 'true') {
                setSubscribedUI();
            }
        };

        function toggleSubscribe() {
            if (localStorage.getItem('varzid_permanent_sub') !== 'true') {
                localStorage.setItem('varzid_permanent_sub', 'true');
                setSubscribedUI();
            }
        }

        function setSubscribedUI() {
            let btn = document.getElementById('subBtn');
            btn.innerText = 'Обуна шудаед ✓';
            btn.classList.add('subscribed');
            document.getElementById('subCountText').innerText = '1 обуначӣ';
        }

        function performSearch() {
            let query = document.getElementById('searchInput').value;
            if(query.trim() !== "") {
                alert('Ҷустуҷӯ аз рӯи маҳсулот: ' + query);
            } else {
                document.getElementById('searchInput').focus();
            }
        }
    </script>

</body>
</html>
