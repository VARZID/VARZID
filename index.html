<!DOCTYPE html>
<html lang="tg" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <header class="header">
        <div class="brand-title-only">VARZID</div>
        <div class="header-icons">
            <span class="icon" id="settingsIcon">⚙️</span>
        </div>
    </header>

    <div class="category-toggle-bar">
        <div class="brand-selector" id="menuToggle">
            <span id="activeCatDisplay">Варзидан</span>
            <span class="arrow" id="arrowIcon">▼</span>
        </div>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-header">
            <span id="catMenuTitle">Интихоби категория</span>
            <span class="close-btn" id="closeMenu">✕</span>
        </div>
        <div class="category-scroll-container">
            <div class="category-list" id="categoryList">
                <div class="category-item active" data-cat="Варзидан">
                    <span class="cat-name" id="catVarzidName">Варзидан</span>
                </div>
                <div class="category-item" data-cat="Мука">
                    <span class="cat-name">Мука</span>
                </div>
                <div class="category-item" data-cat="Комбикорм">
                    <span class="cat-name">Комбикорм</span>
                </div>
                <div class="category-item" data-cat="Пшеница">
                    <span class="cat-name">Пшеница</span>
                </div>
                <div class="category-item" data-cat="Ячмень">
                    <span class="cat-name">Ячмень</span>
                </div>
                <div class="category-item" data-cat="Кукуруза">
                    <span class="cat-name">Кукуруза</span>
                </div>
                <div class="category-item" data-cat="Селитра">
                    <span class="cat-name">Селитра</span>
                </div>
                <div class="category-item" data-cat="Карбамид">
                    <span class="cat-name">Карбамид</span>
                </div>
                <button class="add-category-btn" id="addCategoryBtn" style="display: none;" onclick="openAddCategoryModal()">+</button>
            </div>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <h3 id="settingsTitle">Танзимот</h3>
                <span class="close-btn" id="closeSettings">✕</span>
            </div>
            <div class="settings-section">
                <label id="themeLabel">Мавзӯи рангӣ:</label>
                <div class="settings-options">
                    <button class="option-btn" onclick="setTheme('light')">☀️ <span id="lightText">Режими рӯзона</span></button>
                    <button class="option-btn" onclick="setTheme('dark')">🌙 <span id="darkText">Режими шабона</span></button>
                </div>
            </div>
            <div class="settings-section">
                <label id="langLabel">Забон:</label>
                <div class="settings-options">
                    <button class="option-btn" onclick="setLanguage('tg')">🇹🇯 Тоҷикӣ</button>
                    <button class="option-btn" onclick="setLanguage('ru')">🇷🇺 Русский</button>
                </div>
            </div>
            <div class="settings-section">
                <button class="option-btn admin-toggle-btn" onclick="openAdminModal()" id="adminToggleBtn">🔐 Ҳолати Админ</button>
            </div>
        </div>
    </div>

    <div class="settings-modal" id="adminModal">
        <div class="settings-content">
            <div class="settings-header">
                <h3>Ворид кардани парол</h3>
                <span class="close-btn" onclick="closeAdminModal()">✕</span>
            </div>
            <div class="settings-section">
                <input type="password" id="adminPasswordInput" placeholder="Рамзи админро ворид кунед..." class="order-input">
                <button class="whatsapp-btn" style="margin-top: 10px; background: #2e7d32;" onclick="submitAdminPassword()">Тасдиқ</button>
                <p id="adminErrorMsg" style="color: #e53935; font-size: 12px; margin-top: 8px; display: none;">Рамзи нодуруст!</p>
            </div>
        </div>
    </div>

    <div class="settings-modal" id="addCatModal">
        <div class="settings-content">
            <div class="settings-header">
                <h3>Иловаи маҳсулот</h3>
                <span class="close-btn" onclick="closeAddCategoryModal()">✕</span>
            </div>
            <div class="settings-section">
                <input type="text" id="newCatInput" placeholder="Номи маҳсулоти навро ворид кунед..." class="order-input">
                <button class="whatsapp-btn" style="margin-top: 10px; background: #2e7d32;" onclick="confirmAddCategory()">Илова кардан</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="channel-info" style="display: none;">
            <div class="channel-details">
                <h2 id="channelName">Варзидан</h2>
            </div>
        </div>

        <!-- Галереяи маҳсулот ки тугмаи заказ дар поёни рости он ҷойгир аст -->
        <div class="gallery-container-box">
            <div class="instagram-gallery">
                <div class="gallery-item"><span>📦</span></div>
                <div class="gallery-item"><span>📦</span></div>
                <div class="gallery-item"><span>📦</span></div>
                <div class="gallery-item"><span>📦</span></div>
                <div class="gallery-item"><span>📦</span></div>
                <div class="gallery-item"><span>📦</span></div>
            </div>

            <!-- Тугмаи Заказ дар кунҷи поёни рости контейнери маҳсулот -->
            <button class="product-corner-order-btn" id="toggleOrderBtn" onclick="toggleOrderForm()">
                <span>🛒</span> <span id="orderBtnText">Заказ</span>
            </button>
        </div>

        <!-- Модали формаи Заказ (дар миёни экран кушода мешавад) -->
        <div class="order-modal-overlay" id="orderModalOverlay" style="display: none;">
            <div class="order-section" id="orderSection">
                <div class="settings-header" style="margin-bottom: 12px;">
                    <h3 id="orderTitle">🛒 Фармоиш</h3>
                    <span class="close-btn" onclick="toggleOrderForm()">✕</span>
                </div>
                <p id="orderDesc" style="font-size: 13px; color: #aaa; margin-bottom: 12px;">Маълумоти худро барои тамос ворид кунед:</p>
                <form id="orderForm" onsubmit="sendToWhatsApp(event)">
                    <input type="text" id="clientName" placeholder="Номи шумо..." required class="order-input">
                    <input type="tel" id="clientPhone" placeholder="Рақами телефон (масалан: 900000000)..." required class="order-input">
                    <button type="submit" class="whatsapp-btn" id="orderSubmitBtn">📲 Фиристодан ба WhatsApp</button>
                </form>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
