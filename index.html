<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VARZID — Marketplace</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#16843a;
  --green2:#0d6b2d;
  --bg:#f5f7f6;
  --card:#fff;
  --text:#18231c;
  --muted:#718078;
  --border:#e5ebe7;
  --shadow:0 5px 20px rgba(0,0,0,.07);
}
body.dark{
  --bg:#101512;
  --card:#18201b;
  --text:#f2f5f3;
  --muted:#a7b2ab;
  --border:#2b362f;
  --shadow:0 5px 20px rgba(0,0,0,.25);
}
body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:78px;
}
button,input{
  font:inherit;
}
button{cursor:pointer}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.top{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
}
.logo{
  width:43px;
  height:43px;
}
.brand-name{
  font-size:22px;
  font-weight:800;
  letter-spacing:.5px;
}
.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:50%;
  font-size:20px;
}

/* SEARCH */
.search-wrap{
  padding:0 12px 11px;
}
.search{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:15px;
  padding:0 12px;
  height:48px;
}
.search span{
  font-size:19px;
}
.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:15px;
}
.camera{
  position:relative;
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.camera input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

/* CONTENT */
main{
  max-width:900px;
  margin:auto;
  padding:15px 12px;
}
.section-title{
  font-size:20px;
  font-weight:800;
  margin:8px 2px 12px;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:3px 1px 12px;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:15px;
  padding:10px 13px;
  display:flex;
  align-items:center;
  gap:7px;
  box-shadow:var(--shadow);
}
.cat.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
}
.product-img{
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#edf7ef,#f8fbf9);
  font-size:70px;
}
.dark .product-img{
  background:#202a24;
}
.heart{
  position:absolute;
  right:9px;
  top:9px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:19px;
}
.info{
  padding:11px;
}
.name{
  font-size:16px;
  font-weight:700;
  margin-bottom:6px;
}
.price{
  font-weight:800;
  color:var(--green);
  margin-bottom:9px;
}
.stock{
  font-size:13px;
  margin-bottom:9px;
}
.in{color:#16843a}
.out{color:#d33}
.add{
  width:100%;
  border:0;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  padding:10px;
  font-weight:700;
}
.add.added{
  background:#e8f4eb;
  color:var(--green);
}

/* NO RESULT */
.empty{
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
  display:none;
}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* CART */
.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px;
  margin-bottom:10px;
}
.cart-emoji{
  width:55px;
  height:55px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-size:30px;
}
.cart-info{flex:1}
.cart-name{font-weight:700;margin-bottom:4px}
.cart-price{color:var(--green);font-weight:700}
.remove{
  border:0;
  background:transparent;
  font-size:20px;
}
.total{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:800;
}
.checkout{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:white;
  padding:13px;
  font-weight:800;
}

/* PROFILE */
.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}
.profile-row{
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.profile-row:last-child{border-bottom:0}
.profile-row button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
}

/* MAP */
.map{
  width:100%;
  height:270px;
  border:0;
  border-radius:18px;
  margin-top:12px;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:100;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:12px;
  position:relative;
}
.nav-icon{font-size:21px}
.nav.active{
  color:var(--green);
  font-weight:700;
}
.badge{
  position:absolute;
  top:6px;
  right:24%;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#e53935;
  color:white;
  font-size:10px;
  display:none;
  align-items:center;
  justify-content:center;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translate(-50%,20px);
  background:#18201b;
  color:white;
  padding:12px 17px;
  border-radius:13px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal-bg.show{display:flex}
.modal{
  width:100%;
  max-width:520px;
  background:var(--card);
  border-radius:22px 22px 0 0;
  padding:20px;
}
.modal h3{
  margin-bottom:15px;
}
.modal input{
  width:100%;
  height:46px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 12px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}
.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.modal-buttons button{
  padding:12px;
  border-radius:11px;
  border:0;
}
.cancel{
  background:var(--bg);
  color:var(--text);
}
.send{
  background:var(--green);
  color:white;
}

/* DESKTOP */
@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
  .product-img{height:160px}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="brand">
      <!-- VARZID water-ring style logo built directly into index.html -->
      <svg class="logo" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e9d4b"/>
            <stop offset="1" stop-color="#075c29"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="39" fill="none" stroke="url(#g)" stroke-width="9"/>
        <path d="M29 31 L50 70 L71 31" fill="none" stroke="#16843a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-name">VARZID</div>
    </div>

    <button class="icon-btn" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="search-wrap">
    <div class="search">
      <span>🔎</span>
      <input id="search" type="search" placeholder="Ҷустуҷӯ..." oninput="renderProducts()">

      <label class="camera">
        📷
        <input type="file" accept="image/*" capture="environment" onchange="photoSelected(this)">
      </label>
    </div>
  </div>
</header>

<main>

  <!-- HOME -->
  <section id="homePage" class="page active">

    <div class="section-title" data-t="categories">Категорияҳо</div>

    <div class="categories">
      <button class="cat active" data-cat="all" onclick="setCategory('all',this)">🏪 <span data-t="all">Ҳама</span></button>
      <button class="cat" data-cat="farm" onclick="setCategory('farm',this)">🌾 <span data-t="farm">Кишоварзӣ</span></button>
      <button class="cat" data-cat="vegetable" onclick="setCategory('vegetable',this)">🥕 <span data-t="vegetable">Сабзавот</span></button>
      <button class="cat" data-cat="vitamin" onclick="setCategory('vitamin',this)">💊 <span data-t="vitamin">Витаминҳо</span></button>
      <button class="cat" data-cat="equipment" onclick="setCategory('equipment',this)">🔧 <span data-t="equipment">Таҷҳизот</span></button>
    </div>

    <div class="section-title" data-t="products">Маҳсулот</div>

    <div id="products" class="products"></div>

    <div id="empty" class="empty">
      🔎 <span data-t="notfound">Маҳсулот ёфт нашуд</span>
    </div>

    <div class="section-title" style="margin-top:25px" data-t="map">Харита</div>

    <iframe
      class="map"
      src="https://www.openstreetmap.org/export/embed.html?bbox=69.55%2C37.80%2C69.70%2C37.90&layer=mapnik">
    </iframe>

  </section>


  <!-- FAVORITES -->
  <section id="favoritesPage" class="page">
    <div class="section-title" data-t="favorites">Дӯстдоштаҳо</div>
    <div id="favoritesList" class="products"></div>
    <div id="favoritesEmpty" class="empty" style="display:none">
      ❤️ <span data-t="emptyFav">Ҳоло маҳсулоти дӯстдошта нест</span>
    </div>
  </section>


  <!-- CART -->
  <section id="cartPage" class="page">
    <div class="section-title" data-t="cart">Сабад</div>

    <div id="cartList"></div>

    <div id="cartEmpty" class="empty" style="display:none">
      🛒 <span data-t="emptyCart">Сабад холӣ аст</span>
    </div>

    <div id="cartBottom" style="display:none">
      <div class="total">
        <span data-t="total">Ҳамагӣ</span>
        <span id="total">0 сомонӣ</span>
      </div>

      <button class="checkout" onclick="openOrder()">
        📲 <span data-t="order">Фармоиш додан</span>
      </button>
    </div>
  </section>


  <!-- PROFILE -->
  <section id="profilePage" class="page">
    <div class="section-title" data-t="profile">Профил</div>

    <div class="profile-card">

      <div class="profile-row">
        <button onclick="showOrders()">
          📦 <span data-t="orders">Фармоишҳои ман</span>
        </button>
      </div>

      <div class="profile-row">
        <button onclick="changeLang()">
          🌐 <span data-t="language">Забон</span>:
          <strong id="langName">Тоҷикӣ</strong>
        </button>
      </div>

      <div class="profile-row">
        <button onclick="goHome()">
          🏠 <span data-t="home">Асосӣ</span>
        </button>
      </div>

    </div>

    <div id="ordersBox" style="margin-top:15px"></div>
  </section>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom">
  <button class="nav active" onclick="showPage('homePage',this)">
    <span class="nav-icon">🏠</span>
    <span data-t="home">Асосӣ</span>
  </button>

  <button class="nav" onclick="showPage('favoritesPage',this)">
    <span class="nav-icon">❤️</span>
    <span data-t="favorites">Дӯстдошта</span>
  </button>

  <button class="nav" onclick="showPage('cartPage',this)">
    <span class="nav-icon">🛒</span>
    <span data-t="cart">Сабад</span>
    <span id="cartBadge" class="badge">0</span>
  </button>

  <button class="nav" onclick="showPage('profilePage',this)">
    <span class="nav-icon">👤</span>
    <span data-t="profile">Профил</span>
  </button>
</nav>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<!-- ORDER MODAL -->
<div id="orderModal" class="modal-bg" onclick="closeModalOutside(event)">
  <div class="modal">

    <h3 data-t="orderTitle">Фармоиш</h3>

    <input id="customerName" type="text" placeholder="Ном">
    <input id="customerPhone" type="tel" placeholder="Телефон">
    <input id="customerAddress" type="text" placeholder="Суроға">

    <div class="modal-buttons">
      <button class="cancel" onclick="closeOrder()" data-t="cancel">Бекор кардан</button>
      <button class="send" onclick="sendOrder()" data-t="send">Ирсол кардан</button>
    </div>

  </div>
</div>


<script>

const products = [
  {
    id:1,
    cat:"farm",
    emoji:"🌾",
    price:12,
    tj:"Гандум",
    ru:"Пшеница",
    uz:"Bug‘doy",
    stock:10
  },
  {
    id:2,
    cat:"farm",
    emoji:"🥣",
    price:15,
    tj:"Орд",
    ru:"Мука",
    uz:"Un",
    stock:10
  },
  {
    id:3,
    cat:"farm",
    emoji:"🌽",
    price:10,
    tj:"Чуворимакка",
    ru:"Кукуруза",
    uz:"Makkajo‘xori",
    stock:10
  },
  {
    id:4,
    cat:"vegetable",
    emoji:"🎃",
    price:8,
    tj:"Каду",
    ru:"Тыква",
    uz:"Qovoq",
    stock:10
  },
  {
    id:5,
    cat:"vegetable",
    emoji:"🥬",
    price:0,
    tj:"Сабзавот",
    ru:"Овощи",
    uz:"Sabzavotlar",
    stock:10,
    noPrice:true
  },
  {
    id:6,
    cat:"vitamin",
    emoji:"💊",
    price:0,
    tj:"Витаминҳо",
    ru:"Витамины",
    uz:"Vitaminlar",
    stock:0,
    noPrice:true
  },
  {
    id:7,
    cat:"farm",
    emoji:"🌾",
    price:20,
    tj:"Корм",
    ru:"Корм",
    uz:"Yem",
    stock:10
  },
  {
    id:8,
    cat:"equipment",
    emoji:"🔧",
    price:50,
    tj:"Таҷҳизот",
    ru:"Оборудование",
    uz:"Uskunalar",
    stock:10
  }
];

const translations = {
  tj:{
    categories:"Категорияҳо",
    all:"Ҳама",
    farm:"Кишоварзӣ",
    vegetable:"Сабзавот",
    vitamin:"Витаминҳо",
    equipment:"Таҷҳизот",
    products:"Маҳсулот",
    notfound:"Маҳсулот ёфт нашуд",
    map:"Харита",
    favorites:"Дӯстдошта",
    emptyFav:"Ҳоло маҳсулоти дӯстдошта нест",
    cart:"Сабад",
    emptyCart:"Сабад холӣ аст",
    total:"Ҳамагӣ",
    order:"Фармоиш додан",
    profile:"Профил",
    orders:"Фармоишҳои ман",
    language:"Забон",
    home:"Асосӣ",
    orderTitle:"Фармоиш",
    cancel:"Бекор кардан",
    send:"Ирсол кардан",
    add:"Ба сабад",
    added:"✓ Дар сабад",
    inStock:"Дар мавҷудият",
    outStock:"Тамом шудааст",
    som:"сомонӣ",
    search:"Ҷустуҷӯ..."
  },

  ru:{
    categories:"Категории",
    all:"Все",
    farm:"Сельхоз",
    vegetable:"Овощи",
    vitamin:"Витамины",
    equipment:"Оборудование",
    products:"Товары",
    notfound:"Товар не найден",
    map:"Карта",
    favorites:"Избранное",
    emptyFav:"Избранных товаров пока нет",
    cart:"Корзина",
    emptyCart:"Корзина пуста",
    total:"Итого",
    order:"Оформить заказ",
    profile:"Профиль",
    orders:"Мои заказы",
    language:"Язык",
    home:"Главная",
    orderTitle:"Заказ",
    cancel:"Отмена",
    send:"Отправить",
    add:"В корзину",
    added:"✓ В корзине",
    inStock:"В наличии",
    outStock:"Нет в наличии",
    som:"сомони",
    search:"Поиск..."
  },

  uz:{
    categories:"Kategoriyalar",
    all:"Hammasi",
    farm:"Qishloq xo‘jaligi",
    vegetable:"Sabzavotlar",
    vitamin:"Vitaminlar",
    equipment:"Uskunalar",
    products:"Mahsulotlar",
    notfound:"Mahsulot topilmadi",
    map:"Xarita",
    favorites:"Sevimlilar",
    emptyFav:"Sevimli mahsulotlar yo‘q",
    cart:"Savat",
    emptyCart:"Savat bo‘sh",
    total:"Jami",
    order:"Buyurtma berish",
    profile:"Profil",
    orders:"Buyurtmalarim",
    language:"Til",
    home:"Asosiy",
    orderTitle:"Buyurtma",
    cancel:"Bekor qilish",
    send:"Yuborish",
    add:"Savatga",
    added:"✓ Savatda",
    inStock:"Mavjud",
    outStock:"Tugagan",
    som:"somoni",
    search:"Qidirish..."
  }
};

let lang = localStorage.getItem("varzid_lang") || "tj";
let category = "all";
let cart = JSON.parse(localStorage.getItem("varzid_cart") || "[]");
let favorites = JSON.parse(localStorage.getItem("varzid_favorites") || "[]");
let orders = JSON.parse(localStorage.getItem("varzid_orders") || "[]");


function t(key){
  return translations[lang][key] || key;
}


function productName(p){
  return p[lang] || p.tj;
}


function save(){
  localStorage.setItem("varzid_cart",JSON.stringify(cart));
  localStorage.setItem("varzid_favorites",JSON.stringify(favorites));
  localStorage.setItem("varzid_orders",JSON.stringify(orders));
}


function renderProducts(){

  const box=document.getElementById("products");
  const empty=document.getElementById("empty");

  const q=document.getElementById("search").value.toLowerCase().trim();

  const filtered=products.filter(p=>{

    const matchesCategory =
      category==="all" || p.cat===category;

    const text =
      (p.tj+" "+p.ru+" "+p.uz).toLowerCase();

    const matchesSearch =
      !q || text.includes(q);

    return matchesCategory && matchesSearch;
  });

  box.innerHTML="";

  if(!filtered.length){
    empty.style.display="block";
    return;
  }

  empty.style.display="none";

  filtered.forEach(p=>{

    const fav=favorites.includes(p.id);
    const inCart=cart.includes(p.id);

    const card=document.createElement("div");
    card.className="product";

    card.innerHTML=`
      <div class="product-img">${p.emoji}</div>

      <button class="heart"
        onclick="toggleFavorite(${p.id})">
        ${fav ? "❤️" : "🤍"}
      </button>

      <div class="info">

        <div class="name">${productName(p)}</div>

        ${
          p.noPrice
          ? ""
          : `<div class="price">${p.price} ${t("som")}</div>`
        }

        <div class="stock ${p.stock>0 ? "in":"out"}">
          ${p.stock>0 ? "✓ "+t("inStock") : "✕ "+t("outStock")}
        </div>

        ${
          p.stock>0 && !p.noPrice
          ? `
            <button
              class="add ${inCart ? "added":""}"
              onclick="toggleCart(${p.id})">
              ${inCart ? t("added") : t("add")}
            </button>
          `
          : ""
        }

      </div>
    `;

    box.appendChild(card);
  });
}


function toggleCart(id){

  const index=cart.indexOf(id);

  if(index===-1){

    cart.push(id);

    save();
    updateCart();

    showToast("✓ "+t("added"));

  }else{

    cart.splice(index,1);

    save();
    updateCart();

    showToast(lang==="ru"
      ? "Товар удалён из корзины"
      : lang==="uz"
      ? "Mahsulot savatdan olib tashlandi"
      : "Маҳсулот аз сабад хориҷ шуд"
    );
  }

  renderProducts();
}


function updateCart(){

  const badge=document.getElementById("cartBadge");

  badge.textContent=cart.length;
  badge.style.display=cart.length ? "flex":"none";

  renderCart();
}


function renderCart(){

  const box=document.getElementById("cartList");
  const empty=document.getElementById("cartEmpty");
  const bottom=document.getElementById("cartBottom");

  box.innerHTML="";

  if(!cart.length){

    empty.style.display="block";
    bottom.style.display="none";
    return;
  }

  empty.style.display="none";
  bottom.style.display="block";

  let total=0;

  cart.forEach(id=>{

    const p=products.find(x=>x.id===id);

    if(!p)return;

    total+=p.price;

    const item=document.createElement("div");
    item.className="cart-item";

    item.innerHTML=`
      <div class="cart-emoji">${p.emoji}</div>

      <div class="cart-info">
        <div class="cart-name">${productName(p)}</div>
        <div class="cart-price">${p.price} ${t("som")}</div>
      </div>

      <button class="remove"
        onclick="toggleCart(${p.id})">🗑️</button>
    `;

    box.appendChild(item);
  });

  document.getElementById("total").textContent=
    total+" "+t("som");
}


function toggleFavorite(id){

  const index=favorites.indexOf(id);

  if(index===-1){
    favorites.push(id);
    showToast("❤️");
  }else{
    favorites.splice(index,1);
    showToast("♡");
  }

  save();
  renderProducts();
  renderFavorites();
}


function renderFavorites(){

  const box=document.getElementById("favoritesList");
  const empty=document.getElementById("favoritesEmpty");

  box.innerHTML="";

  if(!favorites.length){
    empty.style.display="block";
    return;
  }

  empty.style.display="none";

  favorites.forEach(id=>{

    const p=products.find(x=>x.id===id);
    if(!p)return;

    const inCart=cart.includes(p.id);

    const card=document.createElement("div");
    card.className="product";

    card.innerHTML=`
      <div class="product-img">${p.emoji}</div>

      <button class="heart"
        onclick="toggleFavorite(${p.id})">❤️</button>

      <div class="info">

        <div class="name">${productName(p)}</div>

        ${
          p.noPrice
          ? ""
          : `<div class="price">${p.price} ${t("som")}</div>`
        }

        <div class="stock ${p.stock>0?"in":"out"}">
          ${p.stock>0 ? "✓ "+t("inStock") : "✕ "+t("outStock")}
        </div>

        ${
          p.stock>0 && !p.noPrice
          ? `
          <button
            class="add ${inCart?"added":""}"
            onclick="toggleCart(${p.id})">
            ${inCart ? t("added") : t("add")}
          </button>
          `
          : ""
        }

      </div>
    `;

    box.appendChild(card);
  });
}


function setCategory(cat,btn){

  category=cat;

  document.querySelectorAll(".cat")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  renderProducts();
}


function showPage(id,btn){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  if(id==="favoritesPage")renderFavorites();
  if(id==="cartPage")renderCart();
}


function goHome(){

  const nav=document.querySelector(".nav");

  showPage("homePage",nav);
}


function showToast(text){

  const toast=document.getElementById("toast");

  toast.textContent=text;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}


function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "varzid_theme",
    document.body.classList.contains("dark") ? "dark":"light"
  );
}


function photoSelected(input){

  if(!input.files.length)return;

  showToast(
    lang==="ru"
    ? "📷 Фото выбрано"
    : lang==="uz"
    ? "📷 Rasm tanlandi"
    : "📷 Сурат интихоб шуд"
  );
}


function openOrder(){

  if(!cart.length){
    showToast(t("emptyCart"));
    return;
  }

  document.getElementById("orderModal")
    .classList.add("show");
}


function closeOrder(){

  document.getElementById("orderModal")
    .classList.remove("show");
}


function closeModalOutside(e){

  if(e.target===document.getElementById("orderModal")){
    closeOrder();
  }
}


function sendOrder(){

  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){

    showToast(
      lang==="ru"
      ? "Заполните все поля"
      : lang==="uz"
      ? "Barcha maydonlarni to‘ldiring"
      : "Ҳамаи майдонҳоро пур кунед"
    );

    return;
  }

  let text=
    lang==="ru"
    ? "Новый заказ%0A%0A"
    : lang==="uz"
    ? "Yangi buyurtma%0A%0A"
    : "Фармоиши нав%0A%0A";

  text+=
    (lang==="ru" ? "Имя: " :
     lang==="uz" ? "Ism: " :
     "Ном: ")
     +encodeURIComponent(name)+"%0A";

  text+=
    (lang==="ru" ? "Телефон: " :
     lang==="uz" ? "Telefon: " :
     "Телефон: ")
     +encodeURIComponent(phone)+"%0A";

  text+=
    (lang==="ru" ? "Адрес: " :
     lang==="uz" ? "Manzil: " :
     "Суроға: ")
     +encodeURIComponent(address)+"%0A%0A";

  text+=
    (lang==="ru" ? "Товары:%0A" :
     lang==="uz" ? "Mahsulotlar:%0A" :
     "Маҳсулотҳо:%0A");

  let total=0;

  cart.forEach(id=>{

    const p=products.find(x=>x.id===id);

    if(!p)return;

    total+=p.price;

    text+=
      encodeURIComponent(
        productName(p)+" — "+p.price+" "+t("som")
      )+"%0A";
  });

  text+="%0A"+encodeURIComponent(
    (lang==="ru" ? "Итого: " :
     lang==="uz" ? "Jami: " :
     "Ҳамагӣ: ")
    +total+" "+t("som")
  );

  orders.unshift({
    id:Date.now(),
    name,
    phone,
    address,
    products:[...cart],
    total
  });

  save();

  const whatsapp="https://wa.me/?text="+text;

  closeOrder();

  cart=[];

  save();
  updateCart();
  renderProducts();

  window.location.href=whatsapp;

  setTimeout(()=>{
    showToast(
      lang==="ru"
      ? "✓ WhatsApp открыт для отправки заказа"
      : lang==="uz"
      ? "✓ Buyurtmani yuborish uchun WhatsApp ochildi"
      : "✓ WhatsApp барои ирсоли фармоиш кушода шуд"
    );
  },500);
}


function showOrders(){

  const box=document.getElementById("ordersBox");

  if(!orders.length){

    box.innerHTML=`
      <div class="empty" style="display:block">
        📦 ${lang==="ru"
        ?"Заказов пока нет"
        :lang==="uz"
        ?"Buyurtmalar yo‘q"
        :"Ҳоло фармоиш нест"}
      </div>
    `;

    return;
  }

  box.innerHTML=orders.map(o=>`

    <div class="profile-card" style="margin-bottom:10px">

      <b>📦 ${lang==="ru"
        ?"Заказ"
        :lang==="uz"
        ?"Buyurtma"
        :"Фармоиш"} #${o.id}</b>

      <p style="margin-top:8px">
        ${o.name}
      </p>

      <p style="color:var(--muted);margin-top:4px">
        ${o.phone}
      </p>

      <p style="margin-top:8px">
        <b>${o.total} ${t("som")}</b>
      </p>

      <button
        onclick="deleteOrder(${o.id})"
        style="
          margin-top:10px;
          border:0;
          padding:9px 12px;
          border-radius:9px;
          background:#fee;
          color:#c33;
        ">
        🗑️ ${lang==="ru"
          ?"Удалить"
          :lang==="uz"
          ?"O‘chirish"
          :"Нест кардан"}
      </button>

    </div>

  `).join("");
}


function deleteOrder(id){

  orders=orders.filter(x=>x.id!==id);

  save();
  showOrders();

  showToast(
    lang==="ru"
    ? "Заказ удалён"
    :lang==="uz"
    ? "Buyurtma o‘chirildi"
    :"Фармоиш нест карда шуд"
  );
}


function changeLang(){

  const next=
    lang==="tj" ? "ru" :
    lang==="ru" ? "uz" : "tj";

  lang=next;

  localStorage.setItem("varzid_lang",lang);

  applyLanguage();

  renderProducts();
  renderFavorites();
  renderCart();
  showOrders();
}


function applyLanguage(){

  document.querySelectorAll("[data-t]")
    .forEach(el=>{
      const key=el.getAttribute("data-t");
      el.textContent=t(key);
    });

  document.getElementById("langName").textContent=
    lang==="tj" ? "Тоҷикӣ" :
    lang==="ru" ? "Русский" :
    "O‘zbekcha";

  document.getElementById("search").placeholder=
    t("search");
}


if(localStorage.getItem("varzid_theme")==="dark"){
  document.body.classList.add("dark");
}

applyLanguage();
renderProducts();
renderFavorites();
updateCart();

</script>

</body>
</html>
