<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАРЗИД</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка бо номи бренд ва тугмаи танзимот -->
    <div class="header">
        <div class="header-top">
            <div class="brand-container" id="brandToggle">
                <span>VARZID</span>
                <span class="arrow">▼</span>
            </div>
            <div class="settings-icon" id="settingsToggle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>
    </div>

    <!-- Менюи зершакл -->
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="subscribers-info">
            <div><span id="subCount">0</span> подписчиков</div>
            <button id="subBtn" class="sub-btn">Подписаться</button>
        </div>

        <div class="menu-header">
            <span>Категорияҳо</span>
            <button class="add-btn admin-only" id="addCategoryBtn">+</button>
        </div>
        <div class="categories-grid" id="categoryList"></div>
    </div>

    <!-- Менюи танзимот -->
    <div class="settings-menu" id="settingsMenu">
        <div class="settings-header" id="closeSettingsHeader">
            <span>Танзимот</span>
            <span class="close-symbol">✕</span>
        </div>
        <div class="settings-list">
            <div class="setting-item" id="setTheme">
                <span>Мавзӯъ (Тема)</span>
                <span class="setting-arrow" id="themeStatus">Ночной режим ›</span>
            </div>
            <div class="setting-item" id="setNotifications">
                <span>Огоҳиҳо</span>
                <span class="setting-arrow" id="notifStatusText">Вкл ›</span>
            </div>
            <div class="setting-item" id="setLanguage" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Забон / Язык / Til</span>
                <select id="langSelect" style="padding: 3px 6px; border-radius: 4px; font-size: 13px;">
                    <option value="tg">Тоҷикӣ</option>
                    <option value="ru" selected>Русский</option>
                    <option value="uz">Oʻzbekcha</option>
                </select>
            </div>
            <div class="setting-item admin-toggle-item" id="adminModeToggle">
                <span>Режими Админ</span>
                <span class="badge-off" id="adminStatusBadge">Выкл</span>
            </div>
        </div>
    </div>

    <!-- Модали интихоби тема -->
    <div class="theme-modal" id="themeModal">
        <div class="theme-modal-content">
            <h3>Интихоби мавзӯъ</h3>
            <div class="theme-option" data-theme="dark">🌙 Ночной режим</div>
            <div class="theme-option" data-theme="light">☀️ Дневной режим</div>
            <div class="theme-option" data-theme="system">💻 Системные</div>
            <button class="theme-cancel" id="cancelTheme">ПАТРУХТАН / ОТМЕНА</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
