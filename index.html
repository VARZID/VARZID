<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАРЗИД</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка бо номи бренд ва тугмаи танзимот -->
    <div class="header">
        <div class="header-top">
            <div class="brand-container" id="brandToggle">
                <span>VARZID</span>
                <span class="arrow">▼</span>
            </div>
            <div class="settings-icon" id="settingsToggle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>
    </div>

    <!-- Менюи зершакл -->
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="subscribers-info">
            <div><span id="subCount">0</span> <span>подписчиков</span></div>
            <button id="subBtn" class="sub-btn">Подписаться</button>
        </div>

        <div class="menu-header">
            <span>Категории</span>
            <button class="add-btn admin-only" id="addCategoryBtn">+</button>
        </div>
        <div class="categories-grid" id="categoryList"></div>
    </div>

    <!-- Менюи танзимот -->
    <div class="settings-menu" id="settingsMenu">
        <div class="settings-header">
            <h3>Танзимот</h3>
            <button id="closeSettingsHeader" style="background: none; border: none; color: inherit; font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <div class="settings-body" style="padding: 15px;">
            <div class="setting-item" id="setTheme" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <span class="settings-label">Тема</span>
                <span class="settings-value" id="themeStatus">Режими шабона ›</span>
            </div>
            <div class="setting-item" id="setNotifications" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <span class="settings-label">Огоҳиҳо</span>
                <span class="settings-value" id="notifStatusText">Фаъол ›</span>
            </div>
            <div class="setting-item" id="setLanguage" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <span class="settings-label">Забон</span>
                <span class="settings-value" id="currentLangDisplay">Тоҷикӣ ›</span>
            </div>
            <div class="setting-item" id="adminModeToggle" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer;">
                <span class="settings-label">Режими Админ</span>
                <span class="badge-off" id="adminStatusBadge">Хомӯш</span>
            </div>
        </div>
    </div>

    <!-- Модали интихоби тема -->
    <div class="theme-modal" id="themeModal">
        <div class="theme-modal-content">
            <h3>Выбор темы</h3>
            <div class="theme-option" data-theme="dark" style="padding: 10px 0; cursor: pointer;">🌙 Ночной режим</div>
            <div class="theme-option" data-theme="light" style="padding: 10px 0; cursor: pointer;">☀️ Дневной режим</div>
            <button class="theme-cancel" id="cancelTheme" style="cursor: pointer;">ОТМЕНА</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
